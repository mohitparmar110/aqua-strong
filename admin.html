<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Admin • Site CMS</title>
</head>

<body class="bg-slate-50 text-slate-800">
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div>
        <h1 class="text-2xl font-bold mb-1">Site CMS</h1>
        <p class="text-slate-600">Hero + Menu + SEO + Pages + FAQ + Reviews + Images + Services</p>
      </div>
      <button id="saveAllTop" class="px-4 py-2 rounded-xl bg-green-600 text-white shadow">Save Changes</button>
    </div>

    <!-- Login -->
    <div class="bg-white rounded-2xl p-5 shadow border mt-6">
      <label class="text-sm font-semibold">ADMIN TOKEN</label>
      <div class="flex gap-2 mt-2 flex-wrap">
        <input id="token" class="flex-1 min-w-[240px] border rounded-xl px-3 py-2" placeholder="Paste token here"/>
        <button id="saveToken" class="px-4 py-2 rounded-xl bg-slate-900 text-white">Save</button>
        <button id="logout" class="px-4 py-2 rounded-xl bg-slate-200">Logout</button>
      </div>
      <p id="loginStatus" class="text-sm mt-2 text-slate-500"></p>

      <!-- tiny status -->
      <div class="mt-3 flex items-center justify-between flex-wrap gap-2">
        <p class="text-xs text-slate-500">
          Config source:
          <span class="font-mono" id="cfgSource">/api/config</span>
        </p>
        <p class="text-xs" id="dirtyState"></p>
      </div>
    </div>

    <!-- Layout -->
    <div class="grid lg:grid-cols-12 gap-6 mt-6">
      <!-- Sidebar -->
      <div class="lg:col-span-3">
        <div class="bg-white rounded-2xl shadow border p-3 sticky top-4">
          <div class="text-xs font-semibold text-slate-500 px-2 pb-2">PANELS</div>
          <nav id="nav" class="space-y-1"></nav>
          <div class="mt-3 border-t pt-3 px-2">
            <p class="text-xs text-slate-500">Tip: Save often after uploads.</p>
            <p class="text-xs text-slate-500 mt-1">Tip: Switching panels auto-collects current edits.</p>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="lg:col-span-9">
        <div class="bg-white rounded-2xl shadow border p-5">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <h2 id="panelTitle" class="text-lg font-bold">Loading…</h2>
            <button id="saveAll" class="px-4 py-2 rounded-xl bg-green-600 text-white">Save Changes</button>
          </div>

          <div id="panel" class="mt-5"></div>
          <p id="msg" class="text-sm mt-4"></p>
        </div>
      </div>
    </div>
  </div>

<script>
/** ============================================================
 *  UPDATED + FIXED ADMIN
 *  ✅ Works with your existing endpoints:
 *    - GET  /api/config
 *    - POST /api/admin/save-config      (expects JSON body)
 *    - POST /api/admin/upload-banner    (expects ?slot=terrace|toilet|heat and multipart "file")
 *  ✅ Keeps "upload-image" ONLY for images map + service/page head images.
 *  ✅ Fixes: slug rename issues, panel switching data loss, wrong svc upload ID,
 *            and ensures collectAll is safe.
 * ============================================================ */

/** -----------------------------
 *  CONFIG + AUTH
 *  ----------------------------- */
const HERO_SLOTS = ["terrace","toilet","heat"];
const PANELS = [
  { id:"hero", title:"Hero Slides" },
  { id:"menu", title:"Menu + Dropdowns" },
  { id:"seo", title:"SEO Panel (Meta, Tags, H1/H2, OG, Canonical, JSON-LD)" },
  { id:"pages", title:"Page Creator / Editor" },
  { id:"faq", title:"FAQ Panel" },
  { id:"reviews", title:"Reviews Updater" },
  { id:"images", title:"Image Uploader + Mapper" },
  { id:"services", title:"Service Editor" }
];

let cfg = null;
let activePanel = "hero";
let isDirty = false;

function getToken(){ return localStorage.getItem("ADMIN_TOKEN") || ""; }
function setToken(t){ localStorage.setItem("ADMIN_TOKEN", t); }
function clearToken(){ localStorage.removeItem("ADMIN_TOKEN"); }

function authHeaders(){
  const t = getToken();
  return t ? { "authorization": "Bearer " + t } : {};
}

function escapeHtml(str){
  return (str||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}

function uid(prefix="id"){
  return prefix + "_" + Math.random().toString(16).slice(2) + "_" + Date.now();
}

/** Make safe IDs from arbitrary keys (slugs, etc.) */
function domSafeKey(str){
  return String(str || "")
    .trim()
    .replace(/^\/+/,"")
    .replace(/[^a-zA-Z0-9_-]/g, "_")
    .slice(0, 64) || ("k_" + Math.random().toString(16).slice(2));
}

function show(text, isErr=false){
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "text-sm mt-4 " + (isErr ? "text-red-600" : "text-green-700");
}

function setDirty(v){
  isDirty = !!v;
  const el = document.getElementById("dirtyState");
  if (!el) return;
  if (isDirty){
    el.textContent = "Unsaved changes";
    el.className = "text-xs text-amber-600 font-semibold";
  } else {
    el.textContent = "";
    el.className = "text-xs";
  }
}

/** -----------------------------
 *  ENSURE CONFIG SHAPE
 *  ----------------------------- */
function ensureSeoShape(s){
  if (!s || typeof s !== "object") s = {};
  s.title = s.title || "";
  s.description = s.description || "";
  s.canonical = s.canonical || "";
  s.robots = s.robots || "";
  s.ogTitle = s.ogTitle || "";
  s.ogDesc = s.ogDesc || "";
  s.ogImage = s.ogImage || "";
  s.schemaJsonLd = s.schemaJsonLd || ""; // string (JSON-LD)
  return s;
}

function ensureShape(c){
  if (!c || typeof c !== "object") c = {};

  // HERO
  if (!c.hero || typeof c.hero !== "object") c.hero = {};
  if (!c.hero.slides || typeof c.hero.slides !== "object") c.hero.slides = {};
  HERO_SLOTS.forEach(slot => {
    if (!c.hero.slides[slot] || typeof c.hero.slides[slot] !== "object") c.hero.slides[slot] = {};
    const s = c.hero.slides[slot];
    s.bg = s.bg || "";
    s.title = s.title || "";
    s.sub = s.sub || "";
    s.bullets = Array.isArray(s.bullets) ? s.bullets : [];
    s.ctaText = s.ctaText || "";
    s.ctaLink = s.ctaLink || "";
  });

  // MENU
  if (!Array.isArray(c.menu)) c.menu = [];
  c.menu = c.menu.map(item => ({
    label: (item && item.label) ? String(item.label) : "",
    url: (item && item.url) ? String(item.url) : "",
    children: Array.isArray(item && item.children) ? item.children.map(ch => ({
      label: ch && ch.label ? String(ch.label) : "",
      url: ch && ch.url ? String(ch.url) : ""
    })) : []
  }));

  // SEO DEFAULTS
  if (!c.seo || typeof c.seo !== "object") c.seo = {};
  c.seo.siteName = c.seo.siteName || "";
  c.seo.defaultTitle = c.seo.defaultTitle || "";
  c.seo.defaultDescription = c.seo.defaultDescription || "";
  c.seo.defaultOgImage = c.seo.defaultOgImage || "";
  c.seo.robots = c.seo.robots || "index,follow";
  c.seo.canonicalBase = c.seo.canonicalBase || "";
  c.seo.tags = Array.isArray(c.seo.tags) ? c.seo.tags : [];
  c.seo.h1Defaults = c.seo.h1Defaults || "";
  c.seo.h2Defaults = c.seo.h2Defaults || "";

  // PAGES (object keyed by slug) + stable internal id for UI
  if (!c.pages || typeof c.pages !== "object") c.pages = {};
  const normalizedPages = {};
  Object.keys(c.pages).forEach(k => {
    const p = c.pages[k] || {};
    p.slug = (p.slug || k || "").replace(/^\/+/,"");
    p._id = p._id || uid("page"); // stable across renders
    p.title = p.title || "";
    p.headImage = p.headImage || "";
    p.contentHtml = p.contentHtml || "";
    p.h1 = p.h1 || "";
    p.h2 = p.h2 || "";
    p.seo = ensureSeoShape(p.seo);
    normalizedPages[p.slug || k] = p;
  });
  c.pages = normalizedPages;

  // FAQ
  if (!Array.isArray(c.faq)) c.faq = [];
  c.faq = c.faq.map(x => ({
    q: x && x.q ? String(x.q) : "",
    a: x && x.a ? String(x.a) : ""
  }));

  // REVIEWS
  if (!Array.isArray(c.reviews)) c.reviews = [];
  c.reviews = c.reviews.map(r => ({
    name: r && r.name ? String(r.name) : "",
    rating: Number(r && r.rating ? r.rating : 5),
    text: r && r.text ? String(r.text) : "",
    date: r && r.date ? String(r.date) : ""
  }));

  // IMAGES MAP
  if (!c.images || typeof c.images !== "object") c.images = {};
  if (!Array.isArray(c.images.map)) c.images.map = [];
  c.images.map = c.images.map.map(m => ({
    key: m && m.key ? String(m.key) : "",
    url: m && m.url ? String(m.url) : "",
    notes: m && m.notes ? String(m.notes) : ""
  }));

  // SERVICES
  if (!Array.isArray(c.services)) c.services = [];
  c.services = c.services.map(s => {
    const out = s && typeof s === "object" ? s : {};
    out.slug = (out.slug || "").replace(/^\/+/,"");
    out.name = out.name || "";
    out.short = out.short || "";
    out.heroImage = out.heroImage || "";
    out.contentHtml = out.contentHtml || "";
    out.h1 = out.h1 || "";
    out.h2 = out.h2 || "";
    out.seo = ensureSeoShape(out.seo);
    return out;
  });

  return c;
}

async function loadConfig(){
  const res = await fetch("/api/config", { cache:"no-store" });
  if (!res.ok) throw new Error("Failed to load /api/config: " + await res.text());
  const data = await res.json();
  cfg = ensureShape(data);
  setDirty(false);
}

/** -----------------------------
 *  UPLOAD HELPERS
 *  ----------------------------- */

/** For hero banners ONLY -> /api/admin/upload-banner?slot=... */
async function uploadHeroBanner({ file, slot }){
  if (!getToken()) throw new Error("Paste ADMIN TOKEN and click Save first.");

  const fd = new FormData();
  fd.append("file", file);

  const qs = new URLSearchParams();
  qs.set("slot", slot);

  const res = await fetch(`/api/admin/upload-banner?${qs.toString()}`, {
    method: "POST",
    headers: authHeaders(),
    body: fd
  });

  if (!res.ok) throw new Error(await res.text());
  const out = await res.json();
  const url = out.publicUrl || out.url || "";
  if (!url) throw new Error("Upload response missing publicUrl");
  return url;
}

/** For images/pages/services (your existing endpoint) -> /api/admin/upload-image?purpose=...&key=... */
async function uploadImageGeneric({ file, purpose, key }){
  if (!getToken()) throw new Error("Paste ADMIN TOKEN and click Save first.");

  const fd = new FormData();
  fd.append("file", file);

  const qs = new URLSearchParams();
  if (purpose) qs.set("purpose", purpose);
  if (key) qs.set("key", key);

  const res = await fetch(`/api/admin/upload-image?${qs.toString()}`, {
    method: "POST",
    headers: authHeaders(),
    body: fd
  });

  if (!res.ok) throw new Error(await res.text());
  const out = await res.json();
  const url = out.publicUrl || out.url || "";
  if (!url) throw new Error("Upload response missing publicUrl");
  return url;
}

/** -----------------------------
 *  NAV + PANEL SWITCH
 *  - Fix: collect current panel before switching to avoid data loss.
 *  ----------------------------- */
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = PANELS.map(p => {
    const isActive = p.id === activePanel;
    return `
      <button data-panel="${p.id}"
        class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold
        ${isActive ? "bg-slate-900 text-white" : "hover:bg-slate-100 text-slate-800"}">
        ${escapeHtml(p.title)}
      </button>
    `;
  }).join("");

  nav.querySelectorAll("[data-panel]").forEach(btn => {
    btn.onclick = () => {
      try { collectAll(); } catch(e) {}
      activePanel = btn.dataset.panel;
      renderAll();
    };
  });
}

/** -----------------------------
 *  HERO PANEL
 *  ----------------------------- */
function heroCard(slot){
  const s = cfg.hero.slides[slot];
  return `
  <div class="border rounded-2xl p-4 bg-white">
    <div class="text-sm font-bold uppercase">${slot}</div>

    <div class="mt-3">
      <label class="text-xs font-semibold">Banner Image</label>
      <input type="file" id="file_${slot}" class="block w-full text-sm mt-1"
             accept="image/png,image/jpeg,image/webp"/>
      <button data-upload-hero="${slot}" class="mt-2 px-3 py-2 rounded-xl bg-slate-900 text-white text-sm w-full">
        Upload Banner
      </button>
      <div class="text-xs text-slate-500 mt-2 break-words">
        Current: <span id="bg_${slot}" class="font-mono">${escapeHtml(s.bg)}</span>
      </div>
    </div>

    <div class="mt-4 space-y-2">
      <label class="text-xs font-semibold">Title</label>
      <input id="title_${slot}" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.title)}"/>

      <label class="text-xs font-semibold">Sub</label>
      <textarea id="sub_${slot}" class="w-full border rounded-xl px-3 py-2" rows="2">${escapeHtml(s.sub)}</textarea>

      <label class="text-xs font-semibold">Bullets (one per line)</label>
      <textarea id="bul_${slot}" class="w-full border rounded-xl px-3 py-2" rows="3">${escapeHtml((s.bullets||[]).join("\n"))}</textarea>

      <label class="text-xs font-semibold">CTA Text</label>
      <input id="ctaText_${slot}" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.ctaText)}"/>

      <label class="text-xs font-semibold">CTA Link</label>
      <input id="ctaLink_${slot}" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.ctaLink)}"/>
    </div>
  </div>`;
}

function panelHero(){
  return `
    <div class="grid md:grid-cols-3 gap-4" id="cards">
      ${HERO_SLOTS.map(heroCard).join("")}
    </div>
  `;
}

async function uploadHero(slot){
  const fileInput = document.getElementById(`file_${slot}`);
  const file = fileInput?.files?.[0];
  if (!file) return show(`Select a file for ${slot} first`, true);

  try{
    const url = await uploadHeroBanner({ file, slot });
    cfg.hero.slides[slot].bg = url;
    document.getElementById(`bg_${slot}`).textContent = url;
    fileInput.value = "";
    setDirty(true);
    show(`Uploaded ${slot} banner ✅ Now click Save Changes`);
  } catch(e){
    show("Upload failed: " + (e.message || e), true);
  }
}

/** -----------------------------
 *  MENU PANEL
 *  ----------------------------- */
function menuItemRow(item, idx){
  const childRows = (item.children || []).map((ch, cidx) => `
    <div class="ml-4 mt-2 border rounded-xl p-3 bg-slate-50">
      <div class="flex gap-2 flex-wrap">
        <input class="border rounded-lg px-2 py-1 flex-1 min-w-[160px]" id="menu_child_label_${idx}_${cidx}"
          placeholder="Sub item label" value="${escapeHtml(ch.label)}"/>
        <input class="border rounded-lg px-2 py-1 flex-1 min-w-[200px]" id="menu_child_url_${idx}_${cidx}"
          placeholder="/subcategory-page" value="${escapeHtml(ch.url)}"/>
        <button class="px-3 py-1 rounded-lg bg-red-600 text-white text-sm"
          data-del-child="${idx}:${cidx}">Remove</button>
      </div>
    </div>
  `).join("");

  return `
    <div class="border rounded-2xl p-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div class="font-semibold">Menu Item #${idx+1}</div>
        <button class="px-3 py-1 rounded-lg bg-red-600 text-white text-sm" data-del-menu="${idx}">Delete</button>
      </div>

      <div class="mt-3 grid md:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Label</label>
          <input id="menu_label_${idx}" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(item.label)}"/>
        </div>
        <div>
          <label class="text-xs font-semibold">URL</label>
          <input id="menu_url_${idx}" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(item.url)}" placeholder="/services"/>
        </div>
      </div>

      <div class="mt-4">
        <div class="flex items-center justify-between">
          <div class="text-sm font-semibold">Dropdown / Subcategory Items</div>
          <button class="px-3 py-1 rounded-lg bg-slate-900 text-white text-sm" data-add-child="${idx}">+ Add Sub Item</button>
        </div>
        ${childRows || `<p class="text-sm text-slate-500 mt-2">No sub items yet.</p>`}
      </div>
    </div>
  `;
}

function panelMenu(){
  return `
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <p class="text-sm text-slate-600">Create menu items and nested dropdown subcategories.</p>
      <button id="addMenu" class="px-4 py-2 rounded-xl bg-slate-900 text-white">+ Add Menu Item</button>
    </div>
    <div class="mt-4 space-y-4" id="menuWrap">
      ${(cfg.menu || []).map(menuItemRow).join("") || `<p class="text-sm text-slate-500">No menu items yet.</p>`}
    </div>
  `;
}

 *  SEO PANEL
 *  ----------------------------- */

    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="text-xs font-semibold">Site Name</label>
        <input id="seo_siteName" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.siteName)}"/>

        <label class="text-xs font-semibold">Canonical Base (example: https://aquastrong.com)</label>

      </div>

      <div>

      <div>
        <label class="text-xs font-semibold">Default Description</label>
        <textarea id="seo_defaultDescription" class="w-full border rounded-xl px-3 py-2" rows="3">${escapeHtml(s.defaultDescription)}</textarea>
      </div>

        <label class="text-xs font-semibold">Default OG Image URL</label>

      <div>
        <label class="text-xs font-semibold">H1 Defaults (optional)</label>

      </div>

        <label class="text-xs font-semibold">H2 Defaults (optional)</label>
        <input id="seo_h2Defaults" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.h2Defaults)}"/>

    <div class="mt-4 p-4 rounded-2xl bg-slate-50 border">

/** -----------------------------
 *  PAGES PANEL
 *  - stable DOM ids using page._id (NOT slug)
 *  ----------------------------- */
function pageEditorCard(p){
  const domKey = domSafeKey(p._id);
  const urlPreview = (cfg.seo.canonicalBase ? cfg.seo.canonicalBase.replace(/\/$/,"") : "") + "/" + (p.slug || "");
  return `
    <div class="border rounded-2xl p-4" data-page-id="${escapeHtml(p._id)}">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div>
          <div class="font-semibold">${escapeHtml(p.title || "(Untitled Page)")}</div>
          <div class="text-xs text-slate-500 break-words">Slug: /${escapeHtml(p.slug || "")}</div>
          ${p.slug ? `<div class="text-xs mt-1">Link: <span class="font-mono">${escapeHtml(urlPreview)}</span></div>` : ``}
        </div>
        <button class="px-3 py-1 rounded-lg bg-red-600 text-white text-sm" data-del-page-id="${escapeHtml(p._id)}">Delete</button>
      </div>

      <div class="mt-4 grid md:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Title</label>
          <input class="w-full border rounded-xl px-3 py-2" id="page_title_${domKey}" value="${escapeHtml(p.title)}"/>
        </div>
        <div>
          <label class="text-xs font-semibold">Slug (no spaces, example: faq)</label>
          <input class="w-full border rounded-xl px-3 py-2" id="page_slug_${domKey}" value="${escapeHtml(p.slug)}"/>
        </div>
      </div>

      <div class="mt-3">
        <label class="text-xs font-semibold">Head Image URL</label>
        <input class="w-full border rounded-xl px-3 py-2" id="page_head_${domKey}" value="${escapeHtml(p.headImage)}" placeholder="https://..."/>
        <div class="grid md:grid-cols-2 gap-2 mt-2">
          <input type="file" id="page_file_${domKey}" class="block w-full text-sm" accept="image/png,image/jpeg,image/webp"/>
          <button class="px-3 py-2 rounded-xl bg-slate-900 text-white text-sm" data-upload-page-head="${escapeHtml(p._id)}">Upload Head Image</button>
        </div>
      </div>

      <div class="mt-3">
        <label class="text-xs font-semibold">H1</label>
        <input class="w-full border rounded-xl px-3 py-2" id="page_h1_${domKey}" value="${escapeHtml(p.h1)}"/>
      </div>
      <div class="mt-3">
        <label class="text-xs font-semibold">H2</label>
        <input class="w-full border rounded-xl px-3 py-2" id="page_h2_${domKey}" value="${escapeHtml(p.h2)}"/>
      </div>

      <div class="mt-3">
        <label class="text-xs font-semibold">Content HTML (paste your written content)</label>
        <textarea class="w-full border rounded-xl px-3 py-2 font-mono text-sm" rows="8" id="page_html_${domKey}">${escapeHtml(p.contentHtml)}</textarea>
      </div>

      <div class="mt-4 p-4 rounded-2xl border bg-slate-50">

    s.ctaText = (document.getElementById(`ctaText_${slot}`)?.value || "").trim();
    s.ctaLink = (document.getElementById(`ctaLink_${slot}`)?.value || "").trim();
  });
}

function collectMenu(){
  const out = [];
  (cfg.menu||[]).forEach((item, idx) => {
    const label = (document.getElementById(`menu_label_${idx}`)?.value || "").trim();
    const url = (document.getElementById(`menu_url_${idx}`)?.value || "").trim();
    const children = [];
    const childCount = (item.children||[]).length;
    for (let cidx=0;cidx<childCount;cidx++){
      const cl = (document.getElementById(`menu_child_label_${idx}_${cidx}`)?.value || "").trim();
      const cu = (document.getElementById(`menu_child_url_${idx}_${cidx}`)?.value || "").trim();
      if (cl || cu) children.push({ label: cl, url: cu });
    }
    if (label || url || children.length) out.push({ label, url, children });
  });
  cfg.menu = out;
}

function collectSEO(){
  cfg.seo.siteName = (document.getElementById("seo_siteName")?.value || "").trim();
  cfg.seo.canonicalBase = (document.getElementById("seo_canonicalBase")?.value || "").trim();
  cfg.seo.defaultTitle = (document.getElementById("seo_defaultTitle")?.value || "").trim();
  cfg.seo.defaultDescription = (document.getElementById("seo_defaultDescription")?.value || "").trim();
  cfg.seo.robots = (document.getElementById("seo_robots")?.value || "").trim();
  cfg.seo.defaultOgImage = (document.getElementById("seo_defaultOgImage")?.value || "").trim();
  cfg.seo.tags = (document.getElementById("seo_tags")?.value || "")
    .split(",").map(x=>x.trim()).filter(Boolean).slice(0,50);
  cfg.seo.h1Defaults = (document.getElementById("seo_h1Defaults")?.value || "").trim();
  cfg.seo.h2Defaults = (document.getElementById("seo_h2Defaults")?.value || "").trim();
}

function collectPages(){
  const cards = Array.from(document.querySelectorAll("[data-page-id]"));
  const next = {};
  const idToOld = {};
  Object.values(cfg.pages||{}).forEach(p => idToOld[p._id] = p);

  cards.forEach(card => {
    const pid = card.getAttribute("data-page-id");
    const domKey = domSafeKey(pid);

    const slug = (document.getElementById(`page_slug_${domKey}`)?.value || "").trim().replace(/^\/+/,"");
    if (!slug) return;

    const title = (document.getElementById(`page_title_${domKey}`)?.value || "").trim();
    const headImage = (document.getElementById(`page_head_${domKey}`)?.value || "").trim();
    const h1 = (document.getElementById(`page_h1_${domKey}`)?.value || "").trim();
    const h2 = (document.getElementById(`page_h2_${domKey}`)?.value || "").trim();
    const contentHtml = (document.getElementById(`page_html_${domKey}`)?.value || "");

    const seo = ensureSeoShape({
      title: (document.getElementById(`page_seo_title_${domKey}`)?.value || "").trim(),
      description: (document.getElementById(`page_seo_desc_${domKey}`)?.value || "").trim(),
      canonical: (document.getElementById(`page_seo_can_${domKey}`)?.value || "").trim(),
      robots: (document.getElementById(`page_seo_robots_${domKey}`)?.value || "").trim(),
      ogTitle: (document.getElementById(`page_seo_ogt_${domKey}`)?.value || "").trim(),
      ogDesc: (document.getElementById(`page_seo_ogd_${domKey}`)?.value || "").trim(),
      ogImage: (document.getElementById(`page_seo_ogi_${domKey}`)?.value || "").trim(),
      schemaJsonLd: (document.getElementById(`page_seo_schema_${domKey}`)?.value || "").trim()
    });

    next[slug] = {
      _id: pid,
      slug,
      title,
      headImage,
      contentHtml,
      h1,
      h2,
      seo
    };
  });

  cfg.pages = next;
}

  const out = [];
  (cfg.faq||[]).forEach((x, idx) => {
    const q = (document.getElementById(`faq_q_${idx}`)?.value || "").trim();

function collectServices(){
  const out = [];
  (cfg.services||[]).forEach((s, idx) => {
    const name = (document.getElementById(`svc_name_${idx}`)?.value || "").trim();
    const slug = (document.getElementById(`svc_slug_${idx}`)?.value || "").trim().replace(/^\/+/,"");
    const short = (document.getElementById(`svc_short_${idx}`)?.value || "").trim();
    const heroImage = (document.getElementById(`svc_hero_${idx}`)?.value || "").trim();
    const h1 = (document.getElementById(`svc_h1_${idx}`)?.value || "").trim();
    const h2 = (document.getElementById(`svc_h2_${idx}`)?.value || "").trim();
    const contentHtml = (document.getElementById(`svc_html_${idx}`)?.value || "");

    const seo = ensureSeoShape({
      title: (document.getElementById(`svc_seo_title_${idx}`)?.value || "").trim(),
      description: (document.getElementById(`svc_seo_desc_${idx}`)?.value || "").trim(),
      canonical: (document.getElementById(`svc_seo_can_${idx}`)?.value || "").trim(),
      robots: (document.getElementById(`svc_seo_robots_${idx}`)?.value || "").trim(),
      ogTitle: (document.getElementById(`svc_seo_ogt_${idx}`)?.value || "").trim(),
      ogDesc: (document.getElementById(`svc_seo_ogd_${idx}`)?.value || "").trim(),
      ogImage: (document.getElementById(`svc_seo_ogi_${idx}`)?.value || "").trim(),
      schemaJsonLd: (document.getElementById(`svc_seo_schema_${idx}`)?.value || "").trim()
    });

    if (name || slug) out.push({ name, slug, short, heroImage, contentHtml, h1, h2, seo });
  });
  cfg.services = out;
}

function collectAll(){
  // Only collect from panels that exist in DOM now
  if (document.getElementById("cards")) collectHero();
  if (document.getElementById("menuWrap")) collectMenu();
  if (document.getElementById("seo_siteName")) collectSEO();
  if (document.getElementById("pagesWrap")) collectPages();
  if (document.getElementById("faqWrap")) collectFAQ();
  if (document.getElementById("reviewsWrap")) collectReviews();
  if (document.getElementById("imagesWrap")) collectImages();
  if (document.getElementById("servicesWrap")) collectServices();

  cfg = ensureShape(cfg);
  setDirty(true);
}

/** -----------------------------
 *  SAVE
 *  ----------------------------- */
async function saveAll(){
  if (!getToken()) return show("Paste ADMIN TOKEN and click Save first.", true);

  try{
    collectAll();
    const res = await fetch("/api/admin/save-config", {
      method: "POST",
      headers: { ...authHeaders(), "content-type": "application/json" },
      body: JSON.stringify(cfg)
    });
    if (!res.ok) return show("Save failed: " + await res.text(), true);
    setDirty(false);
    show("Saved ✅");
  } catch(e){
    show(e.message || "Save failed", true);
  }
}

/** -----------------------------
 *  RENDER PANEL
 *  ----------------------------- */
function renderPanel(){
  const title = PANELS.find(p=>p.id===activePanel)?.title || "Panel";
  document.getElementById("panelTitle").textContent = title;

  const panel = document.getElementById("panel");

  if (activePanel === "hero") {
    panel.innerHTML = panelHero();
    document.querySelectorAll("[data-upload-hero]").forEach(btn=>{
      btn.onclick = ()=> uploadHero(btn.dataset.uploadHero);
    });
  }
  else if (activePanel === "menu") {
    panel.innerHTML = panelMenu();

    document.getElementById("addMenu").onclick = ()=>{
      cfg.menu.push({ label:"", url:"", children:[] });
      setDirty(true);
      renderAll();
    };

    document.querySelectorAll("[data-del-menu]").forEach(btn=>{
      btn.onclick = ()=>{
        collectMenu();
        cfg.menu.splice(Number(btn.dataset.delMenu), 1);
        setDirty(true);
        renderAll();
      };
    });

    document.querySelectorAll("[data-add-child]").forEach(btn=>{
      btn.onclick = ()=>{
        collectMenu();
        const idx = Number(btn.dataset.addChild);
        cfg.menu[idx].children = cfg.menu[idx].children || [];
        cfg.menu[idx].children.push({ label:"", url:"" });
        setDirty(true);
        renderAll();
      };
    });

    document.querySelectorAll("[data-del-child]").forEach(btn=>{
      btn.onclick = ()=>{
        collectMenu();
        const [i,c] = btn.dataset.delChild.split(":").map(Number);
        cfg.menu[i].children.splice(c,1);
        setDirty(true);
        renderAll();
      };
    });
  }
  else if (activePanel === "seo") {
    panel.innerHTML = panelSEO();
  }
  else if (activePanel === "pages") {
    panel.innerHTML = panelPages();

    document.getElementById("addPage").onclick = ()=>{
      const tmpSlug = uid("page").slice(0,10);
      cfg.pages[tmpSlug] = {
        _id: uid("page"),
        slug: tmpSlug,
        title: "New Page",
        headImage: "",
        contentHtml: "<p>Paste your content here…</p>",
        h1: "",
        h2: "",
        seo: ensureSeoShape({})
      };
      setDirty(true);
      renderAll();
    };

    document.querySelectorAll("[data-del-page-id]").forEach(btn=>{
      btn.onclick = ()=>{
        const pid = btn.dataset.delPageId;
        const next = {};
        Object.values(cfg.pages||{}).forEach(p=>{
          if (p._id !== pid) next[p.slug] = p;
        });
        cfg.pages = next;
        setDirty(true);
        renderAll();
      };
    });

    document.querySelectorAll("[data-upload-page-head]").forEach(btn=>{
      btn.onclick = async ()=>{
        const pid = btn.dataset.uploadPageHead;
        const page = Object.values(cfg.pages||{}).find(p => p._id === pid);
        if (!page) return show("Page not found.", true);

        const domKey = domSafeKey(pid);
        const fi = document.getElementById(`page_file_${domKey}`);
        const file = fi?.files?.[0];
        if (!file) return show("Select an image first.", true);

        try{
          const slug = (document.getElementById(`page_slug_${domKey}`)?.value || page.slug || "page").trim().replace(/^\/+/,"");
          const url = await uploadImageGeneric({ file, purpose:"pageHead", key: slug });
          document.getElementById(`page_head_${domKey}`).value = url;
          fi.value = "";
          setDirty(true);
          show("Uploaded ✅ Now click Save Changes");
        } catch(e){
          show("Upload failed: " + (e.message || e), true);
        }
      };
    });
  }
  else if (activePanel === "faq") {
    panel.innerHTML = panelFAQ();

    document.getElementById("addFaq").onclick = ()=>{
      cfg.faq.push({ q:"", a:"" });
      setDirty(true);
      renderAll();
    };

    document.querySelectorAll("[data-del-faq]").forEach(btn=>{
      btn.onclick = ()=>{
        collectFAQ();
        cfg.faq.splice(Number(btn.dataset.delFaq), 1);
        setDirty(true);
        renderAll();
      };
    });
  }
  else if (activePanel === "reviews") {
    panel.innerHTML = panelReviews();

    document.getElementById("addReview").onclick = ()=>{
      cfg.reviews.push({ name:"", rating:5, text:"", date:"" });
      setDirty(true);
      renderAll();
    };

    document.querySelectorAll("[data-del-review]").forEach(btn=>{
      btn.onclick = ()=>{
        collectReviews();
        cfg.reviews.splice(Number(btn.dataset.delReview), 1);
        setDirty(true);
        renderAll();
      };
    });
  }
  else if (activePanel === "images") {
    panel.innerHTML = panelImages();

    document.getElementById("addImgMap").onclick = ()=>{
      cfg.images.map.push({ key:"", url:"", notes:"" });
      setDirty(true);
      renderAll();
    };

    document.querySelectorAll("[data-del-imgmap]").forEach(btn=>{
      btn.onclick = ()=>{
        collectImages();
        cfg.images.map.splice(Number(btn.dataset.delImgmap), 1);
        setDirty(true);
        renderAll();
      };
    });

    document.querySelectorAll("[data-upload-imgmap]").forEach(btn=>{
      btn.onclick = ()=> uploadImgMap(Number(btn.dataset.uploadImgmap));
    });
  }
  else if (activePanel === "services") {
    panel.innerHTML = panelServices();

    document.getElementById("addService").onclick = ()=>{
      cfg.services.push({
        slug:"",
        name:"New Service",
        short:"",
        heroImage:"",
        contentHtml:"<p>Paste service content here…</p>",
        h1:"",
        h2:"",
        seo: ensureSeoShape({})
      });
      setDirty(true);
      renderAll();
    };

    document.querySelectorAll("[data-del-service]").forEach(btn=>{
      btn.onclick = ()=>{
        collectServices();
        cfg.services.splice(Number(btn.dataset.delService), 1);
        setDirty(true);
        renderAll();
      };
    });

    document.querySelectorAll("[data-upload-svc-hero]").forEach(btn=>{
      btn.onclick = ()=> uploadServiceHero(Number(btn.dataset.uploadSvcHero));
    });
  }
  else {
    panel.innerHTML = `<p class="text-sm text-slate-500">Panel not found.</p>`;
  }

  // global: mark dirty on any input change within panel (simple + effective)
  panel.querySelectorAll("input,textarea,select").forEach(el=>{
    el.addEventListener("input", ()=> setDirty(true), { passive:true });
    el.addEventListener("change", ()=> setDirty(true), { passive:true });
  });
}

function renderAll(){
  renderNav();
  renderPanel();
  document.getElementById("loginStatus").textContent =
    getToken() ? "Token saved in browser ✅" : "Not logged in";

  if (!isDirty) setDirty(false);
}

/** -----------------------------
 *  LOGIN BUTTONS
 *  ----------------------------- */
document.getElementById("saveToken").onclick = () => {
  const t = document.getElementById("token").value.trim();
  if (!t) return show("Paste token first.", true);
  setToken(t);
  renderAll();
  show("Token saved ✅");
};

document.getElementById("logout").onclick = () => {
  clearToken();
  renderAll();
  show("Logged out ✅");
};

document.getElementById("saveAll").onclick = saveAll;
document.getElementById("saveAllTop").onclick = saveAll;

/** Warn before leaving with unsaved changes */
window.addEventListener("beforeunload", (e)=>{
  if (!isDirty) return;
  e.preventDefault();
  e.returnValue = "";
});

/** -----------------------------
 *  INIT
 *  ----------------------------- */
(async ()=>{
  try{
    document.getElementById("token").value = getToken();
    document.getElementById("cfgSource").textContent = "/api/config";
    await loadConfig();
    renderAll();
    show("Loaded ✅");
  } catch(e){
    show(e.message || "Failed to load config", true);
  }
})();
</script>
</body>
</html>
