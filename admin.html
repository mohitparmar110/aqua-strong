<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Admin • AquaShield Site CMS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    *{font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial}
  </style>
</head>

<body class="bg-slate-50 text-slate-900">
  <div class="max-w-7xl mx-auto p-6">
    <!-- Header -->
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div>
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-2xl bg-gradient-to-br from-sky-500 to-blue-700 shadow"></div>
          <div>
            <h1 class="text-2xl font-extrabold leading-tight">Site CMS</h1>
            <p class="text-slate-600 text-sm">Hero • Home Sections • Menu • SEO • Pages • FAQ • Reviews • Images • Services</p>
          </div>
        </div>
      </div>

      <div class="flex items-center gap-2">
        <button id="saveAllTop" class="px-4 py-2 rounded-xl bg-green-600 text-white shadow hover:bg-green-700">Save Changes</button>
      </div>
    </div>

    <!-- Login -->
    <div class="bg-white rounded-2xl p-5 shadow border mt-6">
      <div class="flex items-start justify-between gap-4 flex-wrap">
        <div class="flex-1 min-w-[280px]">
          <label class="text-sm font-semibold">ADMIN TOKEN</label>
          <div class="flex gap-2 mt-2 flex-wrap">
            <input id="token" class="flex-1 min-w-[240px] border rounded-xl px-3 py-2" placeholder="Paste token here"/>
            <button id="saveToken" class="px-4 py-2 rounded-xl bg-slate-900 text-white">Save</button>
            <button id="logout" class="px-4 py-2 rounded-xl bg-slate-200 hover:bg-slate-300">Logout</button>
          </div>
          <p id="loginStatus" class="text-sm mt-2 text-slate-500"></p>

          <div class="mt-3 flex items-center justify-between flex-wrap gap-2">
            <p class="text-xs text-slate-500">
              Config source:
              <span class="font-mono" id="cfgSource">/api/config</span>
            </p>
            <p class="text-xs" id="dirtyState"></p>
          </div>
        </div>

        <div class="min-w-[240px]">
          <div class="rounded-2xl border bg-slate-50 p-4">
            <div class="text-xs text-slate-500">Status</div>
            <div id="loadStatus" class="mt-1 font-semibold">Loading…</div>
            <div id="msg" class="text-sm mt-2"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Layout -->
    <div class="grid lg:grid-cols-12 gap-6 mt-6">
      <!-- Sidebar -->
      <div class="lg:col-span-3">
        <div class="bg-white rounded-2xl shadow border p-3 sticky top-4">
          <div class="text-xs font-semibold text-slate-500 px-2 pb-2">PANELS</div>
          <nav id="nav" class="space-y-1"></nav>
          <div class="mt-3 border-t pt-3 px-2">
            <p class="text-xs text-slate-500">Tip: Upload → then Save.</p>
            <p class="text-xs text-slate-500 mt-1">Tip: Switching panels keeps edits.</p>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="lg:col-span-9">
        <div class="bg-white rounded-2xl shadow border p-5">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <div>
              <h2 id="panelTitle" class="text-lg font-extrabold">Loading…</h2>
              <p id="panelSub" class="text-sm text-slate-600 mt-1"></p>
            </div>
            <button id="saveAll" class="px-4 py-2 rounded-xl bg-green-600 text-white shadow hover:bg-green-700">Save Changes</button>
          </div>

          <div id="panel" class="mt-5"></div>
        </div>
      </div>
    </div>
  </div>

<script>
/** ============================================================
 *  PREMIUM ADMIN (UI + Logic)
 *  Endpoints:
 *   - GET  /api/config
 *   - POST /api/admin/save-config   (JSON)
 *   - POST /api/admin/upload-banner?slot=... (multipart file)
 * ============================================================ */

const PANELS = [
  { id:"hero", title:"Hero (Slider + Buttons)", sub:"Create hero slides linked to services. Upload desktop + mobile banners." },
  { id:"menu", title:"Menu + Dropdowns", sub:"Edit header menu + nested dropdown items." },
  { id:"seo", title:"SEO (Site Defaults)", sub:"Default meta title/desc, canonical base, OG image, tags." },
  { id:"pages", title:"Page Creator / Editor", sub:"Create static pages like /about, /faq, /privacy." },
  { id:"faq", title:"FAQ Panel", sub:"Manage FAQs on the site." },
  { id:"reviews", title:"Reviews Updater", sub:"Manage customer testimonials." },
  { id:"images", title:"Image Uploader + Mapper", sub:"Upload images and map them to keys." },
  { id:"services", title:"Service Editor", sub:"Edit services used across site + link in hero slider." },
];

let cfg = null;
let activePanel = "hero";
let isDirty = false;

function getToken(){ return localStorage.getItem("ADMIN_TOKEN") || ""; }
function setToken(t){ localStorage.setItem("ADMIN_TOKEN", t); }
function clearToken(){ localStorage.removeItem("ADMIN_TOKEN"); }
function authHeaders(){ const t = getToken(); return t ? { "authorization": "Bearer " + t } : {}; }

function escapeHtml(str){
  return (str||"")
    .replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
function uid(prefix="id"){ return prefix + "_" + Math.random().toString(16).slice(2) + "_" + Date.now(); }

function show(text, isErr=false){
  const el = document.getElementById("msg");
  el.textContent = text || "";
  el.className = "text-sm mt-2 " + (isErr ? "text-red-600" : "text-green-700");
}
function setDirty(v){
  isDirty = !!v;
  const el = document.getElementById("dirtyState");
  if (!el) return;
  if (isDirty){
    el.textContent = "Unsaved changes";
    el.className = "text-xs text-amber-600 font-semibold";
  } else {
    el.textContent = "";
    el.className = "text-xs";
  }
}

function ensureSeoShape(s){
  if (!s || typeof s !== "object") s = {};
  s.title = s.title || "";
  s.description = s.description || "";
  s.canonical = s.canonical || "";
  s.robots = s.robots || "";
  s.ogTitle = s.ogTitle || "";
  s.ogDesc = s.ogDesc || "";
  s.ogImage = s.ogImage || "";
  s.schemaJsonLd = s.schemaJsonLd || "";
  return s;
}

/** === CONFIG SHAPE NORMALIZER (supports your old + new hero format) === */
function ensureShape(c){
  if (!c || typeof c !== "object") c = {};

  // SERVICES
  if (!Array.isArray(c.services)) c.services = [];
  c.services = c.services.map(s => {
    s = s && typeof s === "object" ? s : {};
    s.slug = (s.slug || "").replace(/^\/+/,"");
    s.name = s.name || "";
    s.short = s.short || "";
    s.heroImage = s.heroImage || "";
    s.contentHtml = s.contentHtml || "";
    s.h1 = s.h1 || "";
    s.h2 = s.h2 || "";
    s.seo = ensureSeoShape(s.seo);
    return s;
  });

  // HERO (NEW preferred): hero.slides = array
  if (!c.hero || typeof c.hero !== "object") c.hero = {};
  if (!c.hero.autoRotateMs) c.hero.autoRotateMs = 5000;

  // migrate old hero.slides.{terrace,toilet,heat} => array
  if (!Array.isArray(c.hero.slides)) {
    const old = (c.hero.slides && typeof c.hero.slides === "object") ? c.hero.slides : null;
    const slidesArr = [];

    if (old) {
      // old keys
      Object.keys(old).forEach(k=>{
        const s = old[k] || {};
        slidesArr.push({
          id: uid("slide"),
          name: (s.title || k),
          serviceSlug: "", // optional link
          title: s.title || "",
          sub: s.sub || "",
          bullets: Array.isArray(s.bullets) ? s.bullets : [],
          ctaText: s.ctaText || "Get Quote",
          ctaLink: s.ctaLink || "",
          imageDesktop: s.bg || s.imageDesktop || "",
          imageMobile: s.imageMobile || "",
        });
      });
    }

    // if nothing, create 3 starter slides from services (if any)
    if (!slidesArr.length && c.services.length){
      c.services.slice(0,3).forEach(s=>{
        slidesArr.push({
          id: uid("slide"),
          name: s.name || "Service Slide",
          serviceSlug: s.slug || "",
          title: s.name || "",
          sub: s.short || "",
          bullets: [],
          ctaText: "Get Quote",
          ctaLink: "",
          imageDesktop: s.heroImage || "",
          imageMobile: "",
        });
      });
    }

    if (!slidesArr.length){
      slidesArr.push({
        id: uid("slide"),
        name: "Basement Waterproofing",
        serviceSlug: "",
        title: "Basement Waterproofing",
        sub: "Stop dampness and seepage before it spreads.",
        bullets: ["Leak inspection", "Injection treatment", "10-year warranty"],
        ctaText: "Get Quote",
        ctaLink: "",
        imageDesktop: "",
        imageMobile: ""
      });
    }

    c.hero.slides = slidesArr;
  }

  // MENU
  if (!Array.isArray(c.menu)) c.menu = [];
  c.menu = c.menu.map(item => ({
    label: (item && item.label) ? String(item.label) : "",
    url: (item && item.url) ? String(item.url) : "",
    children: Array.isArray(item && item.children) ? item.children.map(ch => ({
      label: ch && ch.label ? String(ch.label) : "",
      url: ch && ch.url ? String(ch.url) : ""
    })) : []
  }));

  // SEO DEFAULTS
  if (!c.seo || typeof c.seo !== "object") c.seo = {};
  c.seo.siteName = c.seo.siteName || "";
  c.seo.defaultTitle = c.seo.defaultTitle || "";
  c.seo.defaultDescription = c.seo.defaultDescription || "";
  c.seo.defaultOgImage = c.seo.defaultOgImage || "";
  c.seo.robots = c.seo.robots || "index,follow";
  c.seo.canonicalBase = c.seo.canonicalBase || "";
  c.seo.tags = Array.isArray(c.seo.tags) ? c.seo.tags : [];

  // PAGES
  if (!c.pages || typeof c.pages !== "object") c.pages = {};
  const normalizedPages = {};
  Object.keys(c.pages).forEach(k => {
    const p = c.pages[k] || {};
    p.slug = (p.slug || k || "").replace(/^\/+/,"");
    p._id = p._id || uid("page");
    p.title = p.title || "";
    p.headImage = p.headImage || "";
    p.contentHtml = p.contentHtml || "";
    p.h1 = p.h1 || "";
    p.h2 = p.h2 || "";
    p.seo = ensureSeoShape(p.seo);
    normalizedPages[p.slug || k] = p;
  });
  c.pages = normalizedPages;

  // FAQ
  if (!Array.isArray(c.faq)) c.faq = [];
  c.faq = c.faq.map(x => ({ q: x?.q ? String(x.q) : "", a: x?.a ? String(x.a) : "" }));

  // REVIEWS
  if (!Array.isArray(c.reviews)) c.reviews = [];
  c.reviews = c.reviews.map(r => ({
    name: r?.name ? String(r.name) : "",
    rating: Math.min(5, Math.max(1, Number(r?.rating ?? 5))),
    text: r?.text ? String(r.text) : "",
    date: r?.date ? String(r.date) : "",
  }));

  // IMAGES MAP
  if (!c.images || typeof c.images !== "object") c.images = {};
  if (!Array.isArray(c.images.map)) c.images.map = [];
  c.images.map = c.images.map.map(m => ({ key: m?.key||"", url: m?.url||"", notes: m?.notes||"" }));

  return c;
}

async function loadConfig(){
  const res = await fetch("/api/config", { cache:"no-store" });
  if (!res.ok) throw new Error("Failed to load /api/config: " + await res.text());
  const data = await res.json();
  cfg = ensureShape(data);
  setDirty(false);
}

/** Upload helper: /api/admin/upload-banner?slot=... */
async function uploadBanner({ file, slot }){
  if (!getToken()) throw new Error("Paste ADMIN TOKEN and click Save first.");
  const fd = new FormData();
  fd.append("file", file);
  const qs = new URLSearchParams();
  qs.set("slot", slot);
  const res = await fetch(`/api/admin/upload-banner?${qs.toString()}`, {
    method: "POST",
    headers: authHeaders(),
    body: fd
  });
  if (!res.ok) throw new Error(await res.text());
  const out = await res.json();
  const url = out.publicUrl || out.url || "";
  if (!url) throw new Error("Upload response missing publicUrl");
  return url;
}

/** NAV */
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = PANELS.map(p => {
    const isActive = p.id === activePanel;
    return `
      <button data-panel="${p.id}"
        class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold
        ${isActive ? "bg-slate-900 text-white" : "hover:bg-slate-100 text-slate-800"}">
        ${escapeHtml(p.title)}
      </button>
    `;
  }).join("");

  nav.querySelectorAll("[data-panel]").forEach(btn => {
    btn.onclick = () => {
      try { collectAll(); } catch(e) {}
      activePanel = btn.dataset.panel;
      renderAll();
    };
  });
}

/** HERO PANEL (clean + service-based + desktop/mobile) */
function serviceOptions(selectedSlug){
  const opts = [{slug:"", name:"(Not linked to a service)"}].concat(cfg.services.map(s=>({slug:s.slug, name:s.name||s.slug})));
  return opts.map(o=>{
    const val = o.slug || "";
    return `<option value="${escapeHtml(val)}" ${val===selectedSlug?"selected":""}>${escapeHtml(o.name)}</option>`;
  }).join("");
}

function heroSlideCard(slide, idx){
  const k = slide.id || ("idx_"+idx);
  const desktopSlot = `hero-${k}-desktop`;
  const mobileSlot  = `hero-${k}-mobile`;

  return `
  <div class="border rounded-2xl p-4 bg-white">
    <div class="flex items-start justify-between gap-3">
      <div>
        <div class="text-xs text-slate-500 font-semibold">SLIDE ${idx+1}</div>
        <div class="font-extrabold text-lg mt-0.5">${escapeHtml(slide.name || "Hero Slide")}</div>
      </div>
      <button data-del-slide="${idx}" class="px-3 py-1.5 rounded-xl bg-red-600 text-white text-sm hover:bg-red-700">Delete</button>
    </div>

    <div class="mt-4 grid md:grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold">Slide Name (for admin)</label>
        <input id="hero_name_${k}" class="w-full border rounded-xl px-3 py-2 mt-1" value="${escapeHtml(slide.name||"")}"/>
      </div>
      <div>
        <label class="text-xs font-semibold">Link to Service (optional)</label>
        <select id="hero_service_${k}" class="w-full border rounded-xl px-3 py-2 mt-1">
          ${serviceOptions(slide.serviceSlug||"")}
        </select>
      </div>
    </div>

    <div class="mt-3">
      <label class="text-xs font-semibold">Title</label>
      <input id="hero_title_${k}" class="w-full border rounded-xl px-3 py-2 mt-1" value="${escapeHtml(slide.title||"")}"/>
    </div>

    <div class="mt-3">
      <label class="text-xs font-semibold">Sub</label>
      <textarea id="hero_sub_${k}" class="w-full border rounded-xl px-3 py-2 mt-1" rows="2">${escapeHtml(slide.sub||"")}</textarea>
    </div>

    <div class="mt-3">
      <label class="text-xs font-semibold">Bullets (one per line, max 6)</label>
      <textarea id="hero_bullets_${k}" class="w-full border rounded-xl px-3 py-2 mt-1" rows="3">${escapeHtml((slide.bullets||[]).join("\n"))}</textarea>
    </div>

    <div class="mt-4 grid md:grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold">CTA Text</label>
        <input id="hero_ctaText_${k}" class="w-full border rounded-xl px-3 py-2 mt-1" value="${escapeHtml(slide.ctaText||"Get Quote")}"/>
      </div>
      <div>
        <label class="text-xs font-semibold">CTA Link</label>
        <input id="hero_ctaLink_${k}" class="w-full border rounded-xl px-3 py-2 mt-1" value="${escapeHtml(slide.ctaLink||"")}"/>
      </div>
    </div>

    <!-- Desktop -->
    <div class="mt-5 border rounded-2xl p-4 bg-slate-50">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="font-semibold">Desktop Banner</div>
        <div class="text-xs text-slate-500">Uploads to slot: <span class="font-mono">${escapeHtml(desktopSlot)}</span></div>
      </div>
      <input id="hero_desktopUrl_${k}" class="w-full border rounded-xl px-3 py-2 mt-3 bg-white" value="${escapeHtml(slide.imageDesktop||"")}" placeholder="Desktop banner URL"/>
      <div class="grid md:grid-cols-2 gap-2 mt-2">
        <input type="file" id="hero_desktopFile_${k}" class="block w-full text-sm" accept="image/png,image/jpeg,image/webp"/>
        <button data-upload-desktop="${idx}" class="px-3 py-2 rounded-xl bg-slate-900 text-white text-sm hover:bg-black">Upload Desktop</button>
      </div>
      ${slide.imageDesktop ? `<img class="mt-3 rounded-xl border w-full max-h-56 object-cover" src="${escapeHtml(slide.imageDesktop)}"/>` : `<div class="mt-3 text-sm text-slate-500">No desktop banner yet.</div>`}
    </div>

    <!-- Mobile -->
    <div class="mt-4 border rounded-2xl p-4 bg-slate-50">
      <div class="flex items-center justify-between gap-3 flex-wrap">
        <div class="font-semibold">Mobile Banner</div>
        <div class="text-xs text-slate-500">Uploads to slot: <span class="font-mono">${escapeHtml(mobileSlot)}</span></div>
      </div>
      <input id="hero_mobileUrl_${k}" class="w-full border rounded-xl px-3 py-2 mt-3 bg-white" value="${escapeHtml(slide.imageMobile||"")}" placeholder="Mobile banner URL"/>
      <div class="grid md:grid-cols-2 gap-2 mt-2">
        <input type="file" id="hero_mobileFile_${k}" class="block w-full text-sm" accept="image/png,image/jpeg,image/webp"/>
        <button data-upload-mobile="${idx}" class="px-3 py-2 rounded-xl bg-slate-900 text-white text-sm hover:bg-black">Upload Mobile</button>
      </div>

      ${slide.imageMobile ? `
        <div class="mt-3 border rounded-2xl p-3 bg-white">
          <div class="text-xs text-slate-500 mb-2">Mobile preview</div>
          <div class="mx-auto w-[390px] max-w-full rounded-2xl overflow-hidden border bg-white">
            <img class="w-full h-[240px] object-cover" src="${escapeHtml(slide.imageMobile)}"/>
          </div>
        </div>
      ` : `<div class="mt-3 text-sm text-slate-500">No mobile banner yet.</div>`}
    </div>
  </div>`;
}

function panelHero(){
  const slides = cfg.hero.slides || [];
  return `
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <div class="text-sm text-slate-600">
        <div class="font-semibold text-slate-900">Hero slider (service-based)</div>
        <div>Each slide can have desktop + mobile banners. Link a slide to a service for clean navigation.</div>
      </div>
      <button id="addSlide" class="px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-black">+ Add Slide</button>
    </div>

    <div class="mt-4 grid md:grid-cols-2 gap-4" id="heroWrap">
      ${slides.map(heroSlideCard).join("")}
    </div>

    <div class="mt-5 border rounded-2xl p-4 bg-slate-50">
      <label class="text-xs font-semibold">Auto Rotate (ms)</label>
      <input id="hero_autoMs" type="number" min="1000" step="500" class="w-full border rounded-xl px-3 py-2 mt-1 bg-white"
        value="${escapeHtml(String(cfg.hero.autoRotateMs || 5000))}"/>
      <p class="text-xs text-slate-500 mt-2">Example: 5000 = change slide every 5 seconds.</p>
    </div>
  `;
}

/** MENU PANEL */
function menuItemRow(item, idx){
  const childRows = (item.children || []).map((ch, cidx) => `
    <div class="ml-4 mt-2 border rounded-xl p-3 bg-slate-50">
      <div class="flex gap-2 flex-wrap">
        <input class="border rounded-lg px-2 py-1 flex-1 min-w-[160px]" id="menu_child_label_${idx}_${cidx}"
          placeholder="Sub item label" value="${escapeHtml(ch.label)}"/>
        <input class="border rounded-lg px-2 py-1 flex-1 min-w-[200px]" id="menu_child_url_${idx}_${cidx}"
          placeholder="/subcategory-page" value="${escapeHtml(ch.url)}"/>
        <button class="px-3 py-1 rounded-lg bg-red-600 text-white text-sm"
          data-del-child="${idx}:${cidx}">Remove</button>
      </div>
    </div>
  `).join("");

  return `
    <div class="border rounded-2xl p-4">
      <div class="flex items-center justify-between gap-2 flex-wrap">
        <div class="font-semibold">Menu Item #${idx+1}</div>
        <button class="px-3 py-1 rounded-lg bg-red-600 text-white text-sm" data-del-menu="${idx}">Delete</button>
      </div>

      <div class="mt-3 grid md:grid-cols-2 gap-3">
        <div>
          <label class="text-xs font-semibold">Label</label>
          <input id="menu_label_${idx}" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(item.label)}"/>
        </div>
        <div>
          <label class="text-xs font-semibold">URL</label>
          <input id="menu_url_${idx}" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(item.url)}" placeholder="/services"/>
        </div>
      </div>

      <div class="mt-4">
        <div class="flex items-center justify-between">
          <div class="text-sm font-semibold">Dropdown / Sub Items</div>
          <button class="px-3 py-1 rounded-lg bg-slate-900 text-white text-sm" data-add-child="${idx}">+ Add Sub Item</button>
        </div>
        ${childRows || `<p class="text-sm text-slate-500 mt-2">No sub items yet.</p>`}
      </div>
    </div>
  `;
}

function panelMenu(){
  const items = cfg.menu || [];
  return `
    <div class="flex items-center justify-between gap-2 flex-wrap">
      <p class="text-sm text-slate-600">Create menu items and nested dropdown subcategories.</p>
      <button id="addMenu" class="px-4 py-2 rounded-xl bg-slate-900 text-white hover:bg-black">+ Add Menu Item</button>
    </div>
    <div class="mt-4 space-y-4" id="menuWrap">
      ${items.length ? items.map(menuItemRow).join("") : `
        <div class="border rounded-2xl p-4 bg-slate-50 text-slate-600">
          Your <span class="font-mono">/api/config</span> currently has no <span class="font-mono">menu</span> items.
          If your frontend menu is hard-coded, admin won’t show it until you move it into config.
        </div>
      `}
    </div>
  `;
}

/** SEO PANEL */
function panelSEO(){
  const s = cfg.seo;
  return `
    <div class="grid md:grid-cols-2 gap-4">
      <div>
        <label class="text-xs font-semibold">Site Name</label>
        <input id="seo_siteName" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.siteName)}"/>
      </div>

      <div>
        <label class="text-xs font-semibold">Canonical Base</label>
        <input id="seo_canonicalBase" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.canonicalBase)}" placeholder="https://yourdomain.com"/>
      </div>

      <div>
        <label class="text-xs font-semibold">Default Title</label>
        <input id="seo_defaultTitle" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.defaultTitle)}"/>
      </div>

      <div>
        <label class="text-xs font-semibold">Default Description</label>
        <textarea id="seo_defaultDescription" class="w-full border rounded-xl px-3 py-2" rows="3">${escapeHtml(s.defaultDescription)}</textarea>
      </div>

      <div>
        <label class="text-xs font-semibold">Robots</label>
        <input id="seo_robots" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.robots)}" placeholder="index,follow"/>
      </div>

      <div>
        <label class="text-xs font-semibold">Default OG Image URL</label>
        <input id="seo_defaultOgImage" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml(s.defaultOgImage)}"/>
      </div>

      <div class="md:col-span-2">
        <label class="text-xs font-semibold">Tags (comma separated)</label>
        <input id="seo_tags" class="w-full border rounded-xl px-3 py-2" value="${escapeHtml((s.tags||[]).join(", "))}" placeholder="waterproofing, terrace waterproofing, ..."/>
      </div>
    </div>
  `;
}

/** Minimal stubs for remaining panels (keep your previous ones if you want) */
function panelStub(title){
  return `<div class="border rounded-2xl p-4 bg-slate-50 text-slate-600">
    This panel UI is already working in your current admin. If you want, I can merge your full old panels here too.
    For now, the big fixes are Hero + Menu (the ones you complained about).
  </div>`;
}

/** RENDER PANEL */
function renderPanel(){
  const p = PANELS.find(x=>x.id===activePanel);
  document.getElementById("panelTitle").textContent = p?.title || "Panel";
  document.getElementById("panelSub").textContent = p?.sub || "";

  const panel = document.getElementById("panel");

  if (activePanel==="hero"){
    panel.innerHTML = panelHero();

    document.getElementById("addSlide").onclick = ()=>{
      cfg.hero.slides.push({
        id: uid("slide"),
        name: "New Service Slide",
        serviceSlug: "",
        title: "New Slide",
        sub: "",
        bullets: [],
        ctaText: "Get Quote",
        ctaLink: "",
        imageDesktop: "",
        imageMobile: ""
      });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-slide]").forEach(btn=>{
      btn.onclick = ()=>{
        collectHero();
        cfg.hero.slides.splice(Number(btn.dataset.delSlide), 1);
        setDirty(true);
        renderAll();
      };
    });

    panel.querySelectorAll("[data-upload-desktop]").forEach(btn=>{
      btn.onclick = async ()=>{
        const idx = Number(btn.dataset.uploadDesktop);
        const slide = cfg.hero.slides[idx];
        const k = slide.id;
        const file = document.getElementById(`hero_desktopFile_${k}`)?.files?.[0];
        if (!file) return show("Select desktop file first.", true);
        try{
          const url = await uploadBanner({ file, slot: `hero-${k}-desktop` });
          slide.imageDesktop = url;
          document.getElementById(`hero_desktopUrl_${k}`).value = url;
          setDirty(true);
          show("Desktop banner uploaded ✅ Now Save Changes");
          renderAll();
        }catch(e){ show(e.message||"Upload failed", true); }
      };
    });

    panel.querySelectorAll("[data-upload-mobile]").forEach(btn=>{
      btn.onclick = async ()=>{
        const idx = Number(btn.dataset.uploadMobile);
        const slide = cfg.hero.slides[idx];
        const k = slide.id;
        const file = document.getElementById(`hero_mobileFile_${k}`)?.files?.[0];
        if (!file) return show("Select mobile file first.", true);
        try{
          const url = await uploadBanner({ file, slot: `hero-${k}-mobile` });
          slide.imageMobile = url;
          document.getElementById(`hero_mobileUrl_${k}`).value = url;
          setDirty(true);
          show("Mobile banner uploaded ✅ Now Save Changes");
          renderAll();
        }catch(e){ show(e.message||"Upload failed", true); }
      };
    });
  }
  else if (activePanel==="menu"){
    panel.innerHTML = panelMenu();

    document.getElementById("addMenu").onclick = ()=>{
      cfg.menu.push({ label:"", url:"", children:[] });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-menu]").forEach(btn=>{
      btn.onclick = ()=>{
        collectMenu();
        cfg.menu.splice(Number(btn.dataset.delMenu), 1);
        setDirty(true);
        renderAll();
      };
    });

    panel.querySelectorAll("[data-add-child]").forEach(btn=>{
      btn.onclick = ()=>{
        collectMenu();
        const idx = Number(btn.dataset.addChild);
        cfg.menu[idx].children = cfg.menu[idx].children || [];
        cfg.menu[idx].children.push({ label:"", url:"" });
        setDirty(true);
        renderAll();
      };
    });

    panel.querySelectorAll("[data-del-child]").forEach(btn=>{
      btn.onclick = ()=>{
        collectMenu();
        const [i,c] = btn.dataset.delChild.split(":").map(Number);
        cfg.menu[i].children.splice(c,1);
        setDirty(true);
        renderAll();
      };
    });
  }
  else if (activePanel==="seo"){
    panel.innerHTML = panelSEO();
  }
  else {
    panel.innerHTML = panelStub(p?.title||"Panel");
  }

  // mark dirty on any input
  panel.querySelectorAll("input,textarea,select").forEach(el=>{
    el.addEventListener("input", ()=> setDirty(true), { passive:true });
    el.addEventListener("change", ()=> setDirty(true), { passive:true });
  });
}

/** COLLECT */
function collectHero(){
  const slides = cfg.hero.slides || [];
  slides.forEach(slide=>{
    const k = slide.id;
    slide.name = (document.getElementById(`hero_name_${k}`)?.value || "").trim();
    slide.serviceSlug = (document.getElementById(`hero_service_${k}`)?.value || "").trim();
    slide.title = (document.getElementById(`hero_title_${k}`)?.value || "").trim();
    slide.sub = (document.getElementById(`hero_sub_${k}`)?.value || "").trim();
    slide.bullets = (document.getElementById(`hero_bullets_${k}`)?.value || "")
      .split("\n").map(x=>x.trim()).filter(Boolean).slice(0,6);
    slide.ctaText = (document.getElementById(`hero_ctaText_${k}`)?.value || "").trim();
    slide.ctaLink = (document.getElementById(`hero_ctaLink_${k}`)?.value || "").trim();
    slide.imageDesktop = (document.getElementById(`hero_desktopUrl_${k}`)?.value || "").trim();
    slide.imageMobile  = (document.getElementById(`hero_mobileUrl_${k}`)?.value || "").trim();
  });
  cfg.hero.autoRotateMs = Number(document.getElementById("hero_autoMs")?.value || 5000);
}

function collectMenu(){
  const out = [];
  (cfg.menu||[]).forEach((item, idx) => {
    const label = (document.getElementById(`menu_label_${idx}`)?.value || "").trim();
    const url = (document.getElementById(`menu_url_${idx}`)?.value || "").trim();
    const children = [];
    const childCount = (item.children||[]).length;
    for (let cidx=0;cidx<childCount;cidx++){
      const cl = (document.getElementById(`menu_child_label_${idx}_${cidx}`)?.value || "").trim();
      const cu = (document.getElementById(`menu_child_url_${idx}_${cidx}`)?.value || "").trim();
      if (cl || cu) children.push({ label: cl, url: cu });
    }
    if (label || url || children.length) out.push({ label, url, children });
  });
  cfg.menu = out;
}

function collectSEO(){
  cfg.seo.siteName = (document.getElementById("seo_siteName")?.value || "").trim();
  cfg.seo.canonicalBase = (document.getElementById("seo_canonicalBase")?.value || "").trim();
  cfg.seo.defaultTitle = (document.getElementById("seo_defaultTitle")?.value || "").trim();
  cfg.seo.defaultDescription = (document.getElementById("seo_defaultDescription")?.value || "").trim();
  cfg.seo.robots = (document.getElementById("seo_robots")?.value || "").trim();
  cfg.seo.defaultOgImage = (document.getElementById("seo_defaultOgImage")?.value || "").trim();
  cfg.seo.tags = (document.getElementById("seo_tags")?.value || "").split(",").map(x=>x.trim()).filter(Boolean).slice(0,50);
}

function collectAll(){
  if (document.getElementById("heroWrap")) collectHero();
  if (document.getElementById("menuWrap")) collectMenu();
  if (document.getElementById("seo_siteName")) collectSEO();
  cfg = ensureShape(cfg);
  setDirty(true);
}

/** SAVE */
async function saveAll(){
  if (!getToken()) return show("Paste ADMIN TOKEN and click Save first.", true);
  try{
    collectAll();
    const res = await fetch("/api/admin/save-config", {
      method: "POST",
      headers: { ...authHeaders(), "content-type": "application/json" },
      body: JSON.stringify(cfg)
    });
    if (!res.ok) return show("Save failed: " + await res.text(), true);
    setDirty(false);
    show("Saved ✅");
  }catch(e){
    show(e.message||"Save failed", true);
  }
}

/** TOP BUTTONS */
document.getElementById("saveAll").onclick = saveAll;
document.getElementById("saveAllTop").onclick = saveAll;

document.getElementById("saveToken").onclick = () => {
  const t = document.getElementById("token").value.trim();
  if (!t) return show("Paste token first.", true);
  setToken(t);
  renderAll();
  show("Token saved ✅");
};

document.getElementById("logout").onclick = () => {
  clearToken();
  renderAll();
  show("Logged out ✅");
};

window.addEventListener("beforeunload", (e)=>{
  if (!isDirty) return;
  e.preventDefault();
  e.returnValue = "";
});

/** RENDER ALL */
function renderAll(){
  renderNav();
  renderPanel();
  document.getElementById("loginStatus").textContent = getToken() ? "Token saved in browser ✅" : "Not logged in";
}

/** INIT */
(async ()=>{
  try{
    document.getElementById("token").value = getToken();
    document.getElementById("cfgSource").textContent = "/api/config";
    document.getElementById("loadStatus").textContent = "Loading config…";
    await loadConfig();
    document.getElementById("loadStatus").textContent = "Loaded ✅";
    renderAll();
    show("");
  }catch(e){
    document.getElementById("loadStatus").textContent = "Failed ❌";
    show(e.message || "Failed to load config", true);
  }
})();
</script>
