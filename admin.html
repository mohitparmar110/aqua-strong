<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AquaShield Advanced CMS Dashboard</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Frontend Specific Styles for Preview Rendering */
        .gradient-text {
            background: linear-gradient(135deg, #0ea5e9 0%, #0369a1 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .trust-badge {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(10px);
        }
        .water-wave { position: relative; }
        .water-wave::after {
            content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 4px;
            background: linear-gradient(90deg, #0ea5e9, #22c55e, #0ea5e9);
            background-size: 200% 100%; animation: wave 3s linear infinite;
        }
        @keyframes wave { 0% { background-position: 0% 0%; } 100% { background-position: 200% 0%; } }

        #preview-iframe { transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1); }

        .mobile-view {
            width: 390px;
            height: 844px;
            border: 14px solid #0f172a;
            border-radius: 2.5rem;
            overflow: hidden;
            box-shadow: 0 30px 80px rgba(0,0,0,.25);
        }
        .desktop-view {
            width: 100%;
            max-width: 1200px;
            height: 1000px;
            border-radius: 16px;
        }

        #loading-overlay {
            display: none; position: fixed; inset: 0; background: rgba(255, 255, 255, 0.8);
            z-index: 100; justify-content: center; align-items: center; backdrop-filter: blur(4px);
        }
        .tab-btn.active { border-bottom-color: #0ea5e9; color: #0284c7; background-color: #f0f9ff; }
        .ring-soft { box-shadow: 0 0 0 1px rgba(15, 23, 42, .08) inset; }
    </style>
</head>
<body class="bg-slate-100 h-screen overflow-hidden flex text-slate-900">

    <div id="loading-overlay" class="flex flex-col gap-4">
        <div class="w-12 h-12 border-4 border-sky-500 border-t-transparent rounded-full animate-spin"></div>
        <p class="font-bold text-slate-700 uppercase tracking-widest text-[10px]">Syncing with Production API...</p>
    </div>

    <!-- --- SIDEBAR --- -->
    <aside class="w-[520px] bg-slate-50 border-r border-slate-200 flex flex-col shadow-2xl z-20">
        <!-- Header -->
        <div class="p-6 border-b border-slate-200 flex items-center justify-between bg-white">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-slate-900 flex items-center justify-center text-white font-black italic shadow-lg">AS</div>
                <div>
                    <h2 class="font-black text-lg tracking-tight uppercase leading-none">Admin <span class="text-sky-500">CMS</span></h2>
                    <p class="text-[9px] font-bold text-slate-400 mt-1 uppercase tracking-widest">Site Management Panel</p>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <div id="dirty-pill" class="hidden px-2 py-1 rounded-full bg-amber-100 text-amber-600 text-[8px] font-black uppercase">Unsaved</div>
                <button id="save-all-btn" class="flex items-center gap-2 px-5 py-2.5 bg-green-600 text-white rounded-2xl text-xs font-black transition-all hover:bg-green-700 shadow-lg active:scale-95 uppercase tracking-wider">
                    <i data-lucide="save" class="w-4 h-4"></i>
                    <span>Save Changes</span>
                </button>
            </div>
        </div>

        <!-- Security / Auth Header -->
        <div class="px-6 py-2.5 bg-slate-100 border-b flex items-center justify-between">
            <div id="auth-status-ui" class="text-[10px] font-black text-slate-500 flex items-center gap-2 uppercase tracking-tighter">
                <span class="w-2 h-2 rounded-full bg-slate-300" id="auth-indicator"></span>
                <span id="auth-text">Initializing...</span>
            </div>
            <button id="token-toggle" class="text-[10px] font-black text-sky-600 hover:underline uppercase tracking-tighter">Manage Token</button>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-200 bg-white overflow-x-auto scrollbar-hide">
            <button data-tab="hero" class="tab-btn min-w-[85px] flex-shrink-0 flex flex-col items-center gap-1 py-4 border-b-2 transition-all border-transparent text-slate-400 active">
                <i data-lucide="sparkles" class="w-5 h-5"></i>
                <span class="text-[9px] uppercase font-black">Hero</span>
            </button>
            <button data-tab="pages" class="tab-btn min-w-[85px] flex-shrink-0 flex flex-col items-center gap-1 py-4 border-b-2 transition-all border-transparent text-slate-400">
                <i data-lucide="file-plus" class="w-5 h-5"></i>
                <span class="text-[9px] uppercase font-black">Pages</span>
            </button>
            <button data-tab="menu" class="tab-btn min-w-[85px] flex-shrink-0 flex flex-col items-center gap-1 py-4 border-b-2 transition-all border-transparent text-slate-400">
                <i data-lucide="list" class="w-5 h-5"></i>
                <span class="text-[9px] uppercase font-black">Menu</span>
            </button>
            <button data-tab="services" class="tab-btn min-w-[85px] flex-shrink-0 flex flex-col items-center gap-1 py-4 border-b-2 transition-all border-transparent text-slate-400">
                <i data-lucide="shield-check" class="w-5 h-5"></i>
                <span class="text-[9px] uppercase font-black">Services</span>
            </button>
            <button data-tab="faq" class="tab-btn min-w-[85px] flex-shrink-0 flex flex-col items-center gap-1 py-4 border-b-2 transition-all border-transparent text-slate-400">
                <i data-lucide="help-circle" class="w-5 h-5"></i>
                <span class="text-[9px] uppercase font-black">FAQ</span>
            </button>
            <button data-tab="reviews" class="tab-btn min-w-[85px] flex-shrink-0 flex flex-col items-center gap-1 py-4 border-b-2 transition-all border-transparent text-slate-400">
                <i data-lucide="star" class="w-5 h-5"></i>
                <span class="text-[9px] uppercase font-black">Reviews</span>
            </button>
            <button data-tab="seo" class="tab-btn min-w-[85px] flex-shrink-0 flex flex-col items-center gap-1 py-4 border-b-2 transition-all border-transparent text-slate-400">
                <i data-lucide="search" class="w-5 h-5"></i>
                <span class="text-[9px] uppercase font-black">SEO</span>
            </button>
        </div>

        <!-- Dynamic Controls Content Area -->
        <div id="controls-container" class="flex-1 overflow-y-auto p-6 scrollbar-hide space-y-8 pb-32 bg-slate-50/50">
            <!-- Content Injected via JS -->
        </div>
    </aside>

    <!-- --- PREVIEW AREA --- -->
    <main class="flex-1 flex flex-col">
        <div class="h-16 bg-white border-b border-slate-200 flex items-center justify-between px-8 z-10">
            <div class="flex items-center gap-4">
                <div class="flex bg-slate-100 p-1 rounded-xl">
                    <button id="view-desktop" class="p-2 rounded-lg bg-white shadow-sm text-sky-600">
                        <i data-lucide="monitor" class="w-4 h-4"></i>
                    </button>
                    <button id="view-mobile" class="p-2 rounded-lg text-slate-400 hover:text-slate-600">
                        <i data-lucide="smartphone" class="w-4 h-4"></i>
                    </button>
                </div>

                <div class="text-sm font-bold uppercase tracking-tight text-[11px] text-slate-400">
                    Preview Target:
                    <span id="preview-label" class="text-slate-800 font-black">/index.html</span>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <select id="preview-target-select" class="text-[11px] font-black uppercase bg-slate-50 border border-slate-200 rounded-xl p-2">
                    <option value="home">Homepage (index.html)</option>
                </select>
                <div class="h-6 w-px bg-slate-200"></div>
                <button id="manual-refresh" class="flex items-center gap-2 text-[10px] font-black text-sky-600 uppercase hover:bg-sky-50 px-3 py-2 rounded-lg">
                    <i data-lucide="refresh-cw" class="w-3 h-3"></i>
                    <span>Reload Preview</span>
                </button>
            </div>
        </div>

        <!-- IFRAME WRAPPER -->
        <div class="flex-1 p-8 overflow-y-auto flex justify-center bg-slate-100/50 scrollbar-hide">
            <iframe id="preview-iframe" src="/" class="desktop-view shadow-2xl bg-white" style="border:0;"></iframe>
        </div>
    </main>

    <!-- Token Modal -->
    <div id="token-modal" class="hidden fixed inset-0 bg-slate-900/60 z-[100] items-center justify-center p-4 backdrop-blur-md">
        <div class="bg-white rounded-[2.5rem] p-10 max-w-md w-full shadow-2xl">
            <h3 class="text-3xl font-black text-slate-900 mb-2 uppercase tracking-tighter">Auth Security</h3>
            <p class="text-sm text-slate-500 mb-8">Paste your Admin Token to allow push-to-production updates.</p>
            <input type="password" id="token-input-field" class="w-full p-5 bg-slate-100 border-none rounded-2xl mb-6 focus:ring-4 focus:ring-sky-500/20 outline-none font-bold" placeholder="••••••••••••">
            <div class="flex gap-4">
                <button id="token-save-btn" class="flex-1 bg-slate-900 text-white font-black py-4 rounded-2xl hover:bg-black uppercase tracking-widest text-xs">Save</button>
                <button id="token-logout-btn" class="flex-1 bg-red-50 text-red-600 font-black py-4 rounded-2xl hover:bg-red-100 uppercase tracking-widest text-xs">Clear</button>
            </div>
            <button id="token-close-btn" class="w-full mt-6 text-[10px] font-black text-slate-300 uppercase tracking-widest hover:text-slate-600">Dismiss</button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-10 left-1/2 -translate-x-1/2 bg-slate-900 text-white px-10 py-5 rounded-[2rem] shadow-2xl font-black text-[10px] uppercase tracking-widest opacity-0 pointer-events-none transition-all duration-500 z-[101] flex items-center gap-4">
        <div id="toast-indicator" class="w-2.5 h-2.5 rounded-full bg-green-500 shadow-[0_0_10px_#22c55e]"></div>
        <span id="toast-text">System Updated</span>
    </div>

    <script>
        // --- DATA STATE ---
        let activeTab = 'hero';
        let previewMode = 'desktop';
        let isDirty = false;
        let cfg = null;

        const DEFAULTS = {
            hero: { slides: [], autoRotateMs: 5000 },
            menu: [],
            pages: {},
            services: [],
            faq: [],
            reviews: [],
            images: { map: [] },
            seo: { siteName: "AquaShield", defaultTitle: "", defaultDescription: "", canonicalBase: "", robots: "index,follow", tags: [] },
            navigation: { companyName: "AquaShield", phone: "+91 97695 31112", whatsapp: "919769531112" }
        };

        // --- AUTH ---
        function getToken() { return localStorage.getItem("ADMIN_TOKEN") || ""; }
        function setToken(t) { localStorage.setItem("ADMIN_TOKEN", t); updateAuthUI(); }
        function clearToken() { localStorage.removeItem("ADMIN_TOKEN"); updateAuthUI(); }
        function updateAuthUI() {
            const t = getToken();
            const ind = document.getElementById('auth-indicator');
            const txt = document.getElementById('auth-text');
            if(t) { ind.className = "w-2 h-2 rounded-full bg-green-500"; txt.innerText = "AUTHENTICATED SESSION"; }
            else { ind.className = "w-2 h-2 rounded-full bg-red-500"; txt.innerText = "READ-ONLY MODE"; }
        }

        // --- UTILS ---
        function uid(prefix="id"){ return prefix + "_" + Math.random().toString(16).slice(2) + "_" + Date.now(); }
        function escapeHtml(str){ return (str||"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;"); }
        function domSafeKey(str){ return String(str||"").trim().replace(/^\/+/,"").replace(/[^a-zA-Z0-9_-]/g, "_").slice(0, 64) || ("k_" + Math.random().toString(16).slice(2)); }
        function markDirty(v=true) {
            isDirty = v;
            document.getElementById('dirty-pill').classList.toggle('hidden', !v);
            pushLivePreview();
        }
        function showToast(msg, isErr=false) {
            const t = document.getElementById('toast');
            document.getElementById('toast-text').innerText = msg;
            document.getElementById('toast-indicator').className = `w-2.5 h-2.5 rounded-full ${isErr ? 'bg-red-500' : 'bg-green-500'}`;
            t.style.opacity = '1'; t.style.bottom = '40px';
            setTimeout(() => { t.style.opacity = '0'; t.style.bottom = '30px'; }, 3000);
        }

        // --- SCHEMA NORMALIZATION ---
        function ensureSeoShape(s){
            if (!s || typeof s !== "object") s = {};
            return {
                title: s.title || "", description: s.description || "", canonical: s.canonical || "",
                robots: s.robots || "index,follow", ogTitle: s.ogTitle || "", ogDesc: s.ogDesc || "",
                ogImage: s.ogImage || "", schemaJsonLd: s.schemaJsonLd || ""
            };
        }

        function ensureShape(c){
            if (!c || typeof c !== "object") c = {};
            if (!c.hero) c.hero = { slides: [], autoRotateMs: 5000 };
            if (!Array.isArray(c.hero.slides)) c.hero.slides = [];
            c.hero.slides = c.hero.slides.map(s => ({
                id: s.id || uid("slide"), label: s.label || "Slide", tag: s.tag || "", linkedServiceSlug: (s.linkedServiceSlug || "").replace(/^\/+/,""),
                desktopBg: s.desktopBg || s.bg || "", mobileBg: s.mobileBg || "", title: s.title || "", sub: s.sub || "",
                bullets: Array.isArray(s.bullets) ? s.bullets : [], ctaText: s.ctaText || "Get Quote", ctaLink: s.ctaLink || "/#contact"
            }));
            if (!Array.isArray(c.menu)) c.menu = [];
            if (!c.pages) c.pages = {};
            if (!Array.isArray(c.services)) c.services = [];
            if (!Array.isArray(c.faq)) c.faq = [];
            if (!Array.isArray(c.reviews)) c.reviews = [];
            if (!c.images) c.images = { map: [] };
            if (!Array.isArray(c.images.map)) c.images.map = [];
            if (!c.seo) c.seo = { siteName: "AquaShield", defaultTitle: "", defaultDescription: "", canonicalBase: "", robots: "index,follow", tags: [] };
            if (!c.navigation) c.navigation = { companyName: "AquaShield", phone: "+91 97695 31112", whatsapp: "919769531112" };
            return c;
        }

        // --- API HANDLERS ---
        async function loadConfig() {
            document.getElementById('loading-overlay').style.display = 'flex';
            try {
                const res = await fetch("/api/config", { cache: "no-store" });
                const data = await res.json();
                cfg = ensureShape(data);
                showToast("SITE DATA LOADED");
            } catch (e) {
                cfg = ensureShape(JSON.parse(JSON.stringify(DEFAULTS)));
                showToast("USING DEFAULTS (API FAILED)", true);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
                syncTargetDropdown();
                renderSidebar();
                markDirty(false);
            }
        }

        async function saveConfig() {
            if (!getToken()) { document.getElementById('token-modal').classList.remove('hidden'); return; }

            // ✅ FIX: collect current tab values BEFORE save
            collectAll();

            document.getElementById('loading-overlay').style.display = 'flex';
            try {
                const res = await fetch("/api/admin/save-config", {
                    method: "POST",
                    headers: { "Authorization": "Bearer " + getToken(), "Content-Type": "application/json" },
                    body: JSON.stringify(cfg)
                });
                if (!res.ok) {
                    const t = await res.text().catch(()=> "");
                    throw new Error(t || "Save failed");
                }
                markDirty(false);
                showToast("PUBLISHED LIVE");
            } catch (e) {
                showToast("SYNC FAILED", true);
                console.error(e);
            } finally {
                document.getElementById('loading-overlay').style.display = 'none';
            }
        }

        async function doUpload(file, slot, variant=null) {
            if (!getToken()) { document.getElementById('token-modal').classList.remove('hidden'); return; }
            const fd = new FormData();
            fd.append("file", file);
            let url = `/api/admin/upload-banner?slot=${slot}`;
            if (variant) url += `&variant=${variant}`;
            const res = await fetch(url, { method: "POST", headers: { "Authorization": "Bearer " + getToken() }, body: fd });
            const data = await res.json();
            return data.publicUrl || data.url;
        }

        // --- PANEL RENDERING ---
        function renderSidebar() {
            const container = document.getElementById('controls-container');
            container.innerHTML = '';
            if (activeTab === 'hero') renderHeroPanel(container);
            else if (activeTab === 'pages') renderPagesPanel(container);
            else if (activeTab === 'menu') renderMenuPanel(container);
            else if (activeTab === 'services') renderServicesPanel(container);
            else if (activeTab === 'faq') renderFaqPanel(container);
            else if (activeTab === 'reviews') renderReviewsPanel(container);
            else if (activeTab === 'images') renderImagesPanel(container);
            else if (activeTab === 'seo') renderSeoPanel(container);
            lucide.createIcons();
        }

        function renderHeroPanel(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Homepage Slides</h3>
                    <button id="heroAdd" class="p-2.5 bg-slate-900 text-white rounded-xl shadow-xl hover:scale-105 transition-all"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div id="heroWrap" class="space-y-6">
                    ${cfg.hero.slides.map((s, idx) => {
                        const k = domSafeKey(s.id);
                        return `
                        <div class="p-6 bg-white border border-slate-100 rounded-[2rem] space-y-4 shadow-sm relative group" data-idx="${idx}">
                            <div class="flex justify-between items-center pb-2 border-b border-slate-50">
                                <span class="text-[10px] font-black bg-sky-500 text-white px-3 py-1 rounded-full uppercase">Slide #${idx+1}</span>
                                <div class="flex gap-1">
                                    <button onclick="moveInArr('hero.slides', ${idx}, -1)" class="p-1.5 text-slate-300 hover:text-slate-600"><i data-lucide="chevron-up" class="w-4 h-4"></i></button>
                                    <button onclick="moveInArr('hero.slides', ${idx}, 1)" class="p-1.5 text-slate-300 hover:text-slate-600"><i data-lucide="chevron-down" class="w-4 h-4"></i></button>
                                    <button onclick="deleteInArr('hero.slides', ${idx})" class="p-1.5 text-red-300 hover:text-red-500 ml-2"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                                </div>
                            </div>
                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[9px] font-black text-slate-500 uppercase">Label</label>
                                    <input type="text" id="hs_label_${k}" value="${escapeHtml(s.label)}" class="w-full mt-1 p-3 bg-slate-50 border-none rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-sky-500">
                                </div>
                                <div>
                                    <label class="text-[9px] font-black text-slate-500 uppercase">Badge</label>
                                    <input type="text" id="hs_tag_${k}" value="${escapeHtml(s.tag)}" class="w-full mt-1 p-3 bg-slate-50 border-none rounded-xl text-xs font-bold outline-none">
                                </div>
                            </div>
                            <div>
                                <label class="text-[9px] font-black text-slate-500 uppercase">H1 Headline</label>
                                <input type="text" id="hs_title_${k}" value="${escapeHtml(s.title)}" class="w-full mt-1 p-3 bg-slate-50 border-none rounded-xl text-sm font-black outline-none focus:ring-2 focus:ring-sky-500">
                            </div>
                            <div>
                                <label class="text-[9px] font-black text-slate-500 uppercase">Description</label>
                                <textarea id="hs_sub_${k}" class="w-full mt-1 p-3 bg-slate-50 border-none rounded-xl text-xs h-16 font-medium outline-none">${escapeHtml(s.sub)}</textarea>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-1">
                                    <label class="text-[9px] font-black text-slate-500 uppercase">Desktop Image</label>
                                    <div class="flex gap-2">
                                        <input type="text" id="hs_desktop_${k}" value="${s.desktopBg}" class="flex-1 p-2 bg-white border border-slate-100 rounded-lg text-[9px] truncate" readonly>
                                        <label class="cursor-pointer bg-slate-900 text-white p-2 rounded-lg hover:bg-black"><i data-lucide="upload" class="w-3.5 h-3.5"></i><input type="file" class="hidden" onchange="handleHeroUpload(this, ${idx}, 'desktop')"></label>
                                    </div>
                                </div>
                                <div class="space-y-1">
                                    <label class="text-[9px] font-black text-slate-500 uppercase">Mobile Image</label>
                                    <div class="flex gap-2">
                                        <input type="text" id="hs_mobile_${k}" value="${s.mobileBg}" class="flex-1 p-2 bg-white border border-slate-100 rounded-lg text-[9px] truncate" readonly>
                                        <label class="cursor-pointer bg-slate-900 text-white p-2 rounded-lg hover:bg-black"><i data-lucide="upload" class="w-3.5 h-3.5"></i><input type="file" class="hidden" onchange="handleHeroUpload(this, ${idx}, 'mobile')"></label>
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label class="text-[9px] font-black text-slate-500 uppercase">Bullets (Enter separated)</label>
                                <textarea id="hs_bullets_${k}" class="w-full mt-1 p-3 bg-slate-50 border-none rounded-xl text-[10px] font-bold h-24 tracking-tight outline-none focus:ring-2 focus:ring-sky-500">${s.bullets.join('\n')}</textarea>
                            </div>
                        </div>`;
                    }).join('')}
                </div>`;
            document.getElementById('heroAdd').onclick = () => {
                collectAll();
                cfg.hero.slides.push({ id: uid("slide"), label: "New Slide", tag: "", title: "Water Damage Solution", sub: "10-Year Warranty", bullets: [], desktopBg: "", mobileBg: "" });
                renderSidebar(); markDirty();
            };
        

        function renderPagesPanel(container) {
            const pages = Object.values(cfg.pages).sort((a,b) => (a.slug||"").localeCompare(b.slug||""));
            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Internal Folders</h3>
                    <button id="pageAdd" class="p-2.5 bg-slate-900 text-white rounded-xl shadow-xl"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div id="pagesWrap" class="space-y-4">
                    ${pages.map(p => {
                        const domKey = domSafeKey(p._id);
                        return `
                        <div class="p-6 bg-white border border-slate-100 rounded-[2rem] space-y-4 shadow-sm" data-page-id="${p._id}">
                            <div class="flex justify-between items-center">
                                <span class="text-[10px] font-black text-slate-800 bg-slate-100 px-3 py-1 rounded-full uppercase">Path: /${p.slug}</span>
                                <button onclick="deletePage('${p._id}')" class="text-red-400 hover:text-red-600 transition-colors"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                            <input type="text" id="page_title_${domKey}" value="${escapeHtml(p.title)}" placeholder="Title" class="w-full p-3 bg-slate-50 border-none rounded-xl text-sm font-black outline-none focus:ring-2 focus:ring-sky-500">
                            <input type="text" id="page_slug_${domKey}" value="${escapeHtml(p.slug)}" placeholder="url-slug" class="w-full p-2 bg-slate-50 border-none rounded-lg text-[10px] font-mono outline-none">
                            
                            <div class="space-y-1">
                                <label class="text-[9px] font-black text-slate-500 uppercase tracking-widest">Header Banner</label>
                                <div class="flex gap-2">
                                    <input type="text" id="page_head_${domKey}" value="${p.headImage}" class="flex-1 p-3 bg-slate-50 border-none rounded-xl text-[10px] truncate" readonly>
                                    <label class="cursor-pointer bg-slate-900 text-white p-3 rounded-xl"><i data-lucide="upload" class="w-3.5 h-3.5"></i><input type="file" class="hidden" onchange="handlePageUpload(this, '${p._id}')"></label>
                                </div>
                            </div>

                            <div class="grid grid-cols-2 gap-3">
                                <div>
                                    <label class="text-[9px] font-black text-slate-500 uppercase">H1 Tag</label>
                                    <input type="text" id="page_h1_${domKey}" value="${escapeHtml(p.h1)}" class="w-full p-2 bg-slate-50 border-none rounded-lg text-xs font-bold outline-none">
                                </div>
                                <div>
                                    <label class="text-[9px] font-black text-slate-500 uppercase">H2 Tag</label>
                                    <input type="text" id="page_h2_${domKey}" value="${escapeHtml(p.h2)}" class="w-full p-2 bg-slate-50 border-none rounded-lg text-xs font-bold outline-none">
                                </div>
                            </div>
                            
                            <div class="border rounded-2xl p-4 bg-slate-50/50 space-y-3">
                                <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest">Page SEO & Meta</span>
                                <input type="text" id="page_seo_title_${domKey}" value="${escapeHtml(p.seo.title)}" placeholder="Meta Title" class="w-full p-2 border-b border-slate-100 bg-transparent text-xs font-bold outline-none">
                                <textarea id="page_seo_desc_${domKey}" placeholder="Meta Description" class="w-full p-2 bg-transparent text-xs outline-none h-12">${escapeHtml(p.seo.description)}</textarea>
                            </div>

                            <textarea id="page_html_${domKey}" class="w-full p-4 bg-slate-50 border-none rounded-2xl text-[11px] h-32 font-mono outline-none focus:ring-2 focus:ring-sky-500">${escapeHtml(p.contentHtml)}</textarea>
                        </div>`;
                    }).join('')}
                </div>`;
            document.getElementById('pageAdd').onclick = () => {
                collectAll();
                const tmp = uid("page").slice(0,8);
                cfg.pages[tmp] = { _id: uid("page"), slug: tmp, title: "New Page", headImage: "", h1: "", h2: "", contentHtml: "", seo: ensureSeoShape({}) };
                renderSidebar(); markDirty(); syncTargetDropdown();
            };
        }

        function renderMenuPanel(container) {
            container.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Site Menu</h3>
                    <button id="addMenu" class="p-2.5 bg-slate-900 text-white rounded-xl shadow-xl"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div id="menuWrap" class="space-y-4">
                    ${cfg.menu.map((m, idx) => `
                        <div class="p-6 bg-white border border-slate-100 rounded-[2rem] space-y-4 shadow-sm">
                            <div class="flex gap-2">
                                <input type="text" id="menu_label_${idx}" value="${escapeHtml(m.label)}" placeholder="Label" class="flex-1 p-3 bg-slate-50 border-none rounded-xl text-xs font-black outline-none focus:ring-2 focus:ring-sky-500">
                                <input type="text" id="menu_url_${idx}" value="${escapeHtml(m.url)}" placeholder="URL" class="flex-1 p-3 bg-slate-50 border-none rounded-xl text-[10px] outline-none">
                                <button onclick="deleteInArr('menu', ${idx})" class="text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                            <div class="pl-4 border-l-2 border-sky-100 space-y-3">
                                ${(m.children||[]).map((ch, ci) => `
                                    <div class="flex gap-2 items-center">
                                        <input type="text" id="menu_child_label_${idx}_${ci}" value="${escapeHtml(ch.label)}" placeholder="Sub Label" class="flex-1 p-2 bg-white border border-slate-100 rounded-lg text-[10px] outline-none">
                                        <input type="text" id="menu_child_url_${idx}_${ci}" value="${escapeHtml(ch.url)}" placeholder="/slug" class="flex-1 p-2 bg-white border border-slate-100 rounded-lg text-[10px] outline-none">
                                        <button onclick="deleteChildMenu(${idx}, ${ci})" class="text-red-200"><i data-lucide="minus-circle" class="w-3.5 h-3.5"></i></button>
                                    </div>`).join('')}
                                <button onclick="addChildMenu(${idx})" class="text-[9px] font-black text-sky-500 uppercase hover:underline tracking-widest font-black">+ Add Dropdown Item</button>
                            </div>
                        </div>`).join('')}
                </div>`;
            document.getElementById('addMenu').onclick = () => {
                collectAll();
                cfg.menu.push({ label: "New Item", url: "/", children: [] });
                renderSidebar(); markDirty();
            };
        }

        // --- LIST PANELS (FAQ, REVIEWS, SERVICES, IMAGES, SEO) ---
        function renderFaqPanel(c) {
            c.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">FAQ Content</h3>
                    <button onclick="addItem('faq', { q: '', a: '' })" class="p-2.5 bg-slate-900 text-white rounded-xl"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div class="space-y-4">
                    ${cfg.faq.map((f, i) => `
                        <div class="p-6 bg-white border border-slate-100 rounded-3xl shadow-sm space-y-3">
                            <div class="flex justify-between items-center pb-2 border-b border-slate-50">
                                <span class="text-[9px] font-black text-slate-400">FAQ #${i+1}</span>
                                <button onclick="deleteInArr('faq', ${i})" class="text-red-400"><i data-lucide="trash" class="w-3.5 h-3.5"></i></button>
                            </div>
                            <input type="text" id="faq_q_${i}" value="${escapeHtml(f.q)}" placeholder="The Question" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs font-black outline-none focus:ring-2 focus:ring-sky-500">
                            <textarea id="faq_a_${i}" placeholder="The Answer" class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs h-20 outline-none">${escapeHtml(f.a)}</textarea>
                        </div>`).join('')}
                </div>`;
        }

        function renderReviewsPanel(c) {
            c.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Testimonials</h3>
                    <button onclick="addItem('reviews', { name: '', rating: 5, date: '', text: '' })" class="p-2.5 bg-slate-900 text-white rounded-xl"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div class="space-y-4">
                    ${cfg.reviews.map((r, i) => `
                        <div class="p-6 bg-white border border-slate-100 rounded-3xl shadow-sm space-y-3">
                            <div class="flex gap-2">
                                <input type="text" id="rev_name_${i}" value="${escapeHtml(r.name)}" placeholder="Client Name" class="flex-1 p-3 bg-slate-50 border-none rounded-xl text-xs font-black outline-none">
                                <input type="number" id="rev_rating_${i}" value="${r.rating}" min="1" max="5" class="w-12 p-3 bg-slate-50 border-none rounded-xl text-xs font-bold text-center">
                                <button onclick="deleteInArr('reviews', ${i})" class="text-red-400"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                            </div>
                            <textarea id="rev_text_${i}" placeholder="Client Review Text..." class="w-full p-3 bg-slate-50 border-none rounded-xl text-xs h-20 outline-none">${escapeHtml(r.text)}</textarea>
                        </div>`).join('')}
                </div>`;
        }

        function renderServicesPanel(c) {
            c.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Service Cards</h3>
                    <button onclick="addItem('services', { name: '', slug: '', short: '', heroImage: '', h1: '', h2: '', seo: ensureSeoShape({}) })" class="p-2.5 bg-slate-900 text-white rounded-xl"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div class="space-y-4">
                    ${cfg.services.map((s, i) => `
                        <div class="p-6 bg-white border border-slate-100 rounded-3xl shadow-sm space-y-3">
                            <div class="flex justify-between items-center pb-2 border-b border-slate-50">
                                <input type="text" id="svc_name_${i}" value="${escapeHtml(s.name)}" placeholder="Service Title" class="flex-1 bg-transparent border-none text-sm font-black outline-none focus:ring-2 focus:ring-sky-500">
                                <button onclick="deleteInArr('services', ${i})" class="text-red-400"><i data-lucide="trash" class="w-4 h-4"></i></button>
                            </div>
                            <input type="text" id="svc_slug_${i}" value="${escapeHtml(s.slug)}" placeholder="url-slug" class="w-full p-2 bg-slate-50 border-none rounded-lg text-[10px] font-mono outline-none">
                            <textarea id="svc_short_${i}" placeholder="Short Card Summary..." class="w-full p-2 bg-slate-50 border-none rounded-lg text-xs h-12 outline-none">${escapeHtml(s.short)}</textarea>
                        </div>`).join('')}
                </div>`;
        }

        function renderImagesPanel(c) {
            c.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Image Asset Mapping</h3>
                    <button onclick="addItem('images.map', { key: '', url: '' })" class="p-2.5 bg-slate-900 text-white rounded-xl"><i data-lucide="plus" class="w-4 h-4"></i></button>
                </div>
                <div class="space-y-4">
                    ${cfg.images.map.map((m, i) => `
                        <div class="p-6 bg-white border border-slate-100 rounded-3xl shadow-sm space-y-2">
                            <div class="flex gap-2 items-center">
                                <input type="text" id="img_key_${i}" value="${escapeHtml(m.key)}" placeholder="Asset Key" class="flex-1 p-2 bg-slate-50 border-none rounded-lg text-[10px] font-mono outline-none">
                                <button onclick="deleteInArr('images.map', ${i})" class="text-red-300 hover:text-red-500"><i data-lucide="x" class="w-3.5 h-3.5"></i></button>
                            </div>
                            <input type="text" id="img_url_${i}" value="${escapeHtml(m.url)}" placeholder="https://..." class="w-full p-2 bg-white border border-slate-100 rounded-lg text-[10px] outline-none">
                        </div>`).join('')}
                </div>`;
        }

        function renderSeoPanel(c) {
            const s = cfg.seo;
            c.innerHTML = `
                <h3 class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-6">Site-Wide SEO Defaults</h3>
                <div class="space-y-6">
                    <div>
                        <label class="text-[9px] font-black text-slate-700 uppercase">Site Name</label>
                        <input type="text" id="seo_siteName" value="${escapeHtml(s.siteName)}" class="w-full mt-1 p-4 bg-white border border-slate-200 rounded-2xl text-sm font-black outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                    <div>
                        <label class="text-[9px] font-black text-slate-700 uppercase">Meta Title Default</label>
                        <input type="text" id="seo_defaultTitle" value="${escapeHtml(s.defaultTitle)}" class="w-full mt-1 p-4 bg-white border border-slate-200 rounded-2xl text-sm outline-none focus:ring-2 focus:ring-sky-500">
                    </div>
                    <div>
                        <label class="text-[9px] font-black text-slate-700 uppercase">Meta Description Default</label>
                        <textarea id="seo_defaultDescription" class="w-full mt-1 p-4 bg-white border border-slate-200 rounded-2xl text-sm h-32 outline-none focus:ring-2 focus:ring-sky-500">${escapeHtml(s.defaultDescription)}</textarea>
                    </div>
                    <div>
                        <label class="text-[9px] font-black text-slate-700 uppercase">Canonical Base URL</label>
                        <input type="text" id="seo_canonicalBase" value="${escapeHtml(s.canonicalBase)}" class="w-full mt-1 p-4 bg-white border border-slate-200 rounded-2xl text-xs font-mono outline-none">
                    </div>
                </div>`;
        }
               // --- COLLECTION ENGINE ---
        function collectAll() {
            if (activeTab === 'hero') collectHero();
            if (activeTab === 'pages') collectPages();
            if (activeTab === 'menu') collectMenu();
            if (activeTab === 'services') collectServices();
            if (activeTab === 'faq') collectFaq();
            if (activeTab === 'reviews') collectReviews();
            if (activeTab === 'images') collectImages();
            if (activeTab === 'seo') collectSeo();
            cfg = ensureShape(cfg);
            markDirty(true);
        }

        function collectHero() {
            cfg.hero.slides.forEach((s, idx) => {
                const k = domSafeKey(s.id);
                s.label = document.getElementById(`hs_label_${k}`).value;
                s.tag = document.getElementById(`hs_tag_${k}`).value;
                s.title = document.getElementById(`hs_title_${k}`).value;
                s.sub = document.getElementById(`hs_sub_${k}`).value;
                s.bullets = document.getElementById(`hs_bullets_${k}`).value.split('\n').filter(Boolean);
            });
        }

        function collectPages() {
            Object.values(cfg.pages).forEach(p => {
                const k = domSafeKey(p._id);
                const el = document.getElementById(`page_title_${k}`);
                if(!el) return;
                p.title = el.value;
                p.slug = document.getElementById(`page_slug_${k}`).value;
                p.h1 = document.getElementById(`page_h1_${k}`).value;
                p.h2 = document.getElementById(`page_h2_${k}`).value;
                p.contentHtml = document.getElementById(`page_html_${k}`).value;
                p.seo.title = document.getElementById(`page_seo_title_${k}`).value;
                p.seo.description = document.getElementById(`page_seo_desc_${k}`).value;
            });
        }

        function collectMenu() {
            cfg.menu.forEach((m, i) => {
                m.label = document.getElementById(`menu_label_${i}`).value;
                m.url = document.getElementById(`menu_url_${i}`).value;
                (m.children||[]).forEach((ch, ci) => {
                    ch.label = document.getElementById(`menu_child_label_${i}_${ci}`).value;
                    ch.url = document.getElementById(`menu_child_url_${i}_${ci}`).value;
                });
            });
        }
        
        function collectFaq() { cfg.faq = cfg.faq.map((f, i) => ({ q: document.getElementById(`faq_q_${i}`).value, a: document.getElementById(`faq_a_${i}`).value })); }
        function collectReviews() { cfg.reviews = cfg.reviews.map((r, i) => ({ name: document.getElementById(`rev_name_${i}`).value, rating: Number(document.getElementById(`rev_rating_${i}`).value), text: document.getElementById(`rev_text_${i}`).value })); }
        function collectImages() { cfg.images.map = cfg.images.map.map((m, i) => ({ key: document.getElementById(`img_key_${i}`).value, url: document.getElementById(`img_url_${i}`).value })); }
        function collectServices() { cfg.services = cfg.services.map((s, i) => ({ name: document.getElementById(`svc_name_${i}`).value, slug: document.getElementById(`svc_slug_${i}`).value, short: document.getElementById(`svc_short_${i}`).value })); }
        function collectSeo() { 
            cfg.seo.siteName = document.getElementById('seo_siteName').value; 
            cfg.seo.defaultTitle = document.getElementById('seo_defaultTitle').value; 
            cfg.seo.defaultDescription = document.getElementById('seo_defaultDescription').value;
            cfg.seo.canonicalBase = document.getElementById('seo_canonicalBase').value;
        }

        // --- ITEM ACTIONS ---
        function moveInArr(path, idx, dir) {
            collectAll();
            const parts = path.split('.'); let arr = cfg;
            parts.forEach(p => arr = arr[p]);
            const target = idx + dir;
            if (target < 0 || target >= arr.length) return;
            [arr[idx], arr[target]] = [arr[target], arr[idx]];
            renderSidebar(); 
        }

        function deleteInArr(path, idx) {
            if(!confirm("Permanently delete this entry?")) return;
            collectAll();
            const parts = path.split('.'); let arr = cfg;
            parts.forEach(p => arr = arr[p]);
            arr.splice(idx, 1);
            renderSidebar(); 
        }

        function addItem(path, item) {
            collectAll();
            const parts = path.split('.'); let arr = cfg;
            parts.forEach(p => arr = arr[p]);
            arr.push(item);
            renderSidebar();
        }

        function addChildMenu(idx) {
            collectAll();
            if(!cfg.menu[idx].children) cfg.menu[idx].children = [];
            cfg.menu[idx].children.push({ label: "", url: "" });
            renderSidebar();
        }

        function deleteChildMenu(idx, ci) { collectAll(); cfg.menu[idx].children.splice(ci, 1); renderSidebar(); }

        function deletePage(id) {
            if(!confirm("Delete this page folder?")) return;
            const next = {};
            Object.values(cfg.pages).forEach(p => { if(p._id !== id) next[p.slug] = p; });
            cfg.pages = next; syncTargetDropdown(); renderSidebar(); 
        }

        // --- UPLOADS ---
        async function handleHeroUpload(input, idx, variant) {
            const file = input.files[0]; if(!file) return;
            try {
                const url = await doUpload(file, cfg.hero.slides[idx].id, variant);
                const field = variant === 'mobile' ? 'mobileBg' : 'desktopBg';
                cfg.hero.slides[idx][field] = url;
                markDirty(); renderSidebar(); 
            } catch(e) { showToast("Upload Failed", true); }
        }

        async function handlePageUpload(input, id) {
            const file = input.files[0]; if(!file) return;
            try {
                const url = await doUpload(file, id);
                Object.values(cfg.pages).find(p => p._id === id).headImage = url;
                markDirty(); renderSidebar(); 
            } catch(e) { showToast("Upload Failed", true); }
        }

        // --- EVENTS & INIT ---
        function syncTargetDropdown() {
            const sel = document.getElementById('preview-target-select');
            sel.innerHTML = '<option value="home">Homepage (index.html)</option>';
            Object.values(cfg.pages).forEach(p => {
                const opt = document.createElement('option'); opt.value = p.slug; opt.innerText = `/${p.slug}/index.html`;
                sel.appendChild(opt);
            });
        }
        function renderPreview() {
  const sel = document.getElementById('preview-target-select');
  const label = document.getElementById('preview-label');
  const iframe = document.getElementById('preview-iframe');

  const v = sel?.value || "home";
  const url = (v === "home") ? "/" : `/${v}/`;

  if (label) label.innerText = (v === "home") ? "/index.html" : `/${v}/index.html`;

  // force reload of preview page
  if (iframe) iframe.src = url + `?v=${Date.now()}`;

  // after reload, your postMessage preview will be sent on markDirty()
}

        function attachEvents() {
            document.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => {
                collectAll();
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                b.classList.add('active'); activeTab = b.dataset.tab; renderSidebar();
            });
            document.getElementById('save-all-btn').onclick = saveConfig;
            document.getElementById('token-toggle').onclick = () => document.getElementById('token-modal').classList.toggle('hidden');
            document.getElementById('token-close-btn').onclick = () => document.getElementById('token-modal').classList.add('hidden');
            document.getElementById('token-save-btn').onclick = () => { setToken(document.getElementById('token-input-field').value); document.getElementById('token-modal').classList.add('hidden'); };
            document.getElementById('token-logout-btn').onclick = () => { clearToken(); document.getElementById('token-modal').classList.add('hidden'); };
            document.getElementById('preview-target-select').onchange = () => {
  const v = document.getElementById('preview-target-select').value;
  const frame = document.getElementById('preview-iframe');
  frame.src = v === "home" ? "/" : `/${v}/`;
  document.getElementById('preview-label').innerText = v === "home" ? "/index.html" : `/${v}/index.html`;
};

            document.getElementById('view-desktop').onclick = () => {
            previewMode='desktop';
          document.getElementById('preview-iframe').className="desktop-view shadow-2xl bg-white";
};
document.getElementById('view-mobile').onclick = () => {
  previewMode='mobile';
  document.getElementById('preview-iframe').className="mobile-view shadow-2xl bg-white";
};

            document.getElementById('manual-refresh').onclick = () => {
            document.getElementById("preview-iframe").contentWindow.location.reload();
        };

        }
       function pushLivePreview() {
    if (!cfg) return;
    const frame = document.getElementById("preview-iframe");
    if (!frame?.contentWindow) return;

    frame.contentWindow.postMessage({
        type: "AQUASHIELD_CONFIG_PREVIEW",
        config: cfg
    }, "*");
}

        window.onload = () => { updateAuthUI(); attachEvents(); loadConfig(); };
    </script>
</body>
</html>
