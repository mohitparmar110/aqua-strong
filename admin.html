<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <title>Admin • Site CMS</title>
</head>

<body class="bg-slate-50 text-slate-800">
  <div class="max-w-6xl mx-auto p-6">
    <div class="flex items-start justify-between gap-4 flex-wrap">
      <div>
        <h1 class="text-2xl font-bold mb-1">Site CMS</h1>
        <p class="text-slate-600">Hero + Home Sections + Menu + SEO + Pages + FAQ + Reviews + Images + Services</p>
      </div>
      <button id="saveAllTop" class="px-4 py-2 rounded-xl bg-green-600 text-white shadow">Save Changes</button>
    </div>

    <!-- Login -->
    <div class="bg-white rounded-2xl p-5 shadow border mt-6">
      <label class="text-sm font-semibold">ADMIN TOKEN</label>
      <div class="flex gap-2 mt-2 flex-wrap">
        <input id="token" class="flex-1 min-w-[240px] border rounded-xl px-3 py-2" placeholder="Paste token here"/>
        <button id="saveToken" class="px-4 py-2 rounded-xl bg-slate-900 text-white">Save</button>
        <button id="logout" class="px-4 py-2 rounded-xl bg-slate-200">Logout</button>
      </div>
      <p id="loginStatus" class="text-sm mt-2 text-slate-500"></p>

      <div class="mt-3 flex items-center justify-between flex-wrap gap-2">
        <p class="text-xs text-slate-500">
          Config source:
          <span class="font-mono" id="cfgSource">/api/config</span>
        </p>
        <p class="text-xs" id="dirtyState"></p>
      </div>
    </div>

    <!-- Layout -->
    <div class="grid lg:grid-cols-12 gap-6 mt-6">
      <!-- Sidebar -->
      <div class="lg:col-span-3">
        <div class="bg-white rounded-2xl shadow border p-3 sticky top-4">
          <div class="text-xs font-semibold text-slate-500 px-2 pb-2">PANELS</div>
          <nav id="nav" class="space-y-1"></nav>
          <div class="mt-3 border-t pt-3 px-2">
            <p class="text-xs text-slate-500">Tip: Save often after uploads.</p>
            <p class="text-xs text-slate-500 mt-1">Tip: Switching panels auto-collects current edits.</p>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="lg:col-span-9">
        <div class="bg-white rounded-2xl shadow border p-5">
          <div class="flex items-center justify-between gap-3 flex-wrap">
            <h2 id="panelTitle" class="text-lg font-bold">Loading…</h2>
            <button id="saveAll" class="px-4 py-2 rounded-xl bg-green-600 text-white">Save Changes</button>
          </div>

          <div id="panel" class="mt-5"></div>
          <p id="msg" class="text-sm mt-4"></p>
        </div>
      </div>
    </div>
  </div>

<script>
/** ============================================================
 *  FULL UPDATED ADMIN (Dynamic Hero + Home Sections)
 *  ✅ Endpoints (unchanged):
 *    - GET  /api/config
 *    - POST /api/admin/save-config      (JSON body)
 *    - POST /api/admin/upload-banner    (multipart "file", uses ?slot=...)
 *    - POST /api/admin/upload-image     (multipart "file", uses ?purpose=...&key=...)
 *
 *  ✅ Dynamic Hero:
 *    cfg.hero = {
 *      autoRotateMs,
 *      slides: [{ id,key,title,sub,bullets,image,ctaText,ctaLink }],
 *      buttons: [{ label, slideKey }]
 *    }
 *
 *  ✅ Home Sections:
 *    cfg.home.servicesGrid[]  (homepage 6 cards)
 *    cfg.home.projects[]      (transformation)
 *    cfg.home.advantages[]    (advantage cards)
 *    cfg.home.process[]       (4 steps)
 *    cfg.home.cta             (bottom CTA strip)
 *    cfg.contact              (phone/whatsapp/email/address/hours)
 *    cfg.footer               (footer text + quick links)
 * ============================================================ */

/** -----------------------------
 *  PANELS
 *  ----------------------------- */
const PANELS = [
  { id:"hero", title:"Hero (Slides + Buttons)" },
  { id:"home_services", title:"Home • Services Grid" },
  { id:"home_projects", title:"Home • Projects / Transformation" },
  { id:"home_advantages", title:"Home • Advantage Cards" },
  { id:"home_process", title:"Home • 4-Step Process" },
  { id:"home_cta_contact", title:"Home • CTA + Contact + Footer" },
  { id:"menu", title:"Menu + Dropdowns" },
  { id:"seo", title:"SEO (Site Defaults)" },
  { id:"pages", title:"Page Creator / Editor" },
  { id:"faq", title:"FAQ Panel" },
  { id:"reviews", title:"Reviews Updater" },
  { id:"images", title:"Image Uploader + Mapper" },
  { id:"services", title:"Service Editor" }
];

let cfg = null;
let activePanel = "hero";
let isDirty = false;

/** -----------------------------
 *  AUTH
 *  ----------------------------- */
function getToken(){ return localStorage.getItem("ADMIN_TOKEN") || ""; }
function setToken(t){ localStorage.setItem("ADMIN_TOKEN", t); }
function clearToken(){ localStorage.removeItem("ADMIN_TOKEN"); }

function authHeaders(){
  const t = getToken();
  return t ? { "authorization": "Bearer " + t } : {};
}

/** -----------------------------
 *  HELPERS
 *  ----------------------------- */
function escapeHtml(str){
  return (str||"")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
function uid(prefix="id"){
  return prefix + "_" + Math.random().toString(16).slice(2) + "_" + Date.now();
}
function domSafeKey(str){
  return String(str || "")
    .trim()
    .replace(/^\/+/,"")
    .replace(/[^a-zA-Z0-9_-]/g, "_")
    .slice(0, 64) || ("k_" + Math.random().toString(16).slice(2));
}
function show(text, isErr=false){
  const el = document.getElementById("msg");
  el.textContent = text;
  el.className = "text-sm mt-4 " + (isErr ? "text-red-600" : "text-green-700");
}
function setDirty(v){
  isDirty = !!v;
  const el = document.getElementById("dirtyState");
  if (!el) return;
  if (isDirty){
    el.textContent = "Unsaved changes";
    el.className = "text-xs text-amber-600 font-semibold";
  } else {
    el.textContent = "";
    el.className = "text-xs";
  }
}
function clamp(n, min, max){
  n = Number(n);
  if (Number.isNaN(n)) return min;
  return Math.max(min, Math.min(max, n));
}

/** -----------------------------
 *  CONFIG SHAPE
 *  ----------------------------- */
function ensureSeoShape(s){
  if (!s || typeof s !== "object") s = {};
  s.title = s.title || "";
  s.description = s.description || "";
  s.canonical = s.canonical || "";
  s.robots = s.robots || "";
  s.ogTitle = s.ogTitle || "";
  s.ogDesc = s.ogDesc || "";
  s.ogImage = s.ogImage || "";
  s.schemaJsonLd = s.schemaJsonLd || ""; // string
  return s;
}

function normalizeOldHeroIfNeeded(c){
  // If old shape exists: c.hero.slides.terrace/toilet/heat => convert into array + buttons
  if (!c || !c.hero) return;

  const oldSlides = c.hero && c.hero.slides && !Array.isArray(c.hero.slides) ? c.hero.slides : null;
  if (!oldSlides) return;

  // Detect old slots keys
  const keys = Object.keys(oldSlides || {});
  const looksOld = keys.length && keys.every(k => typeof oldSlides[k] === "object" && ("bg" in oldSlides[k] || "title" in oldSlides[k]));
  if (!looksOld) return;

  const slidesArr = [];
  const buttonsArr = [];

  keys.forEach(k => {
    const s = oldSlides[k] || {};
    const key = String(k || "").trim() || uid("slide").slice(0,8);
    slidesArr.push({
      id: s.id || uid("slide"),
      key,
      title: s.title || "",
      sub: s.sub || "",
      bullets: Array.isArray(s.bullets) ? s.bullets : [],
      image: s.bg || "",
      ctaText: s.ctaText || "Get Quote",
      ctaLink: s.ctaLink || ""
    });
    buttonsArr.push({ label: key.charAt(0).toUpperCase() + key.slice(1), slideKey: key });
  });

  c.hero.slides = slidesArr;
  c.hero.buttons = buttonsArr;
  delete c.hero.slides.terrace; // just in case, but array now
}

function ensureShape(c){
  if (!c || typeof c !== "object") c = {};

  // SEO (site)
  if (!c.seo || typeof c.seo !== "object") c.seo = {};
  c.seo.siteName = c.seo.siteName || "";
  c.seo.defaultTitle = c.seo.defaultTitle || "";
  c.seo.defaultDescription = c.seo.defaultDescription || "";
  c.seo.defaultOgImage = c.seo.defaultOgImage || "";
  c.seo.robots = c.seo.robots || "index,follow";
  c.seo.canonicalBase = c.seo.canonicalBase || "";
  c.seo.tags = Array.isArray(c.seo.tags) ? c.seo.tags : [];
  c.seo.h1Defaults = c.seo.h1Defaults || "";
  c.seo.h2Defaults = c.seo.h2Defaults || "";

  // MENU
  if (!Array.isArray(c.menu)) c.menu = [];
  c.menu = c.menu.map(item => ({
    label: (item && item.label) ? String(item.label) : "",
    url: (item && item.url) ? String(item.url) : "",
    children: Array.isArray(item && item.children) ? item.children.map(ch => ({
      label: ch && ch.label ? String(ch.label) : "",
      url: ch && ch.url ? String(ch.url) : ""
    })) : []
  }));

  // HERO (dynamic)
  if (!c.hero || typeof c.hero !== "object") c.hero = {};
  normalizeOldHeroIfNeeded(c);

  c.hero.autoRotateMs = clamp(c.hero.autoRotateMs || 5000, 0, 60000);
  if (!Array.isArray(c.hero.slides)) c.hero.slides = [];
  if (!Array.isArray(c.hero.buttons)) c.hero.buttons = [];

  c.hero.slides = c.hero.slides.map(s => {
    const out = (s && typeof s === "object") ? s : {};
    out.id = out.id || uid("slide");
    out.key = (out.key || "").trim() || ("slide_" + out.id.slice(-6));
    out.title = out.title || "";
    out.sub = out.sub || "";
    out.bullets = Array.isArray(out.bullets) ? out.bullets : [];
    out.image = out.image || out.bg || ""; // tolerate old naming
    delete out.bg;
    out.ctaText = out.ctaText || "";
    out.ctaLink = out.ctaLink || "";
    return out;
  });

  c.hero.buttons = c.hero.buttons.map(b => ({
    label: (b && b.label) ? String(b.label) : "",
    slideKey: (b && b.slideKey) ? String(b.slideKey) : ""
  }));

  // HOME SECTIONS
  if (!c.home || typeof c.home !== "object") c.home = {};

  if (!Array.isArray(c.home.servicesGrid)) c.home.servicesGrid = [];
  c.home.servicesGrid = c.home.servicesGrid.map(x => ({
    title: x && x.title ? String(x.title) : "",
    subtitle: x && x.subtitle ? String(x.subtitle) : "",
    bullets: Array.isArray(x && x.bullets) ? x.bullets.map(String) : [],
    icon: x && x.icon ? String(x.icon) : "", // optional (url or lucide name)
    linkText: x && x.linkText ? String(x.linkText) : "Get Quote",
    linkUrl: x && x.linkUrl ? String(x.linkUrl) : ""
  }));

  if (!Array.isArray(c.home.projects)) c.home.projects = [];
  c.home.projects = c.home.projects.map(p => ({
    title: p && p.title ? String(p.title) : "",
    tag: p && p.tag ? String(p.tag) : "", // BEFORE/AFTER etc.
    image: p && p.image ? String(p.image) : "",
    subtitle: p && p.subtitle ? String(p.subtitle) : "",
    linkUrl: p && p.linkUrl ? String(p.linkUrl) : ""
  }));

  if (!Array.isArray(c.home.advantages)) c.home.advantages = [];
  c.home.advantages = c.home.advantages.map(a => ({
    title: a && a.title ? String(a.title) : "",
    subtitle: a && a.subtitle ? String(a.subtitle) : "",
    icon: a && a.icon ? String(a.icon) : "" // optional
  }));

  if (!Array.isArray(c.home.process)) c.home.process = [];
  c.home.process = c.home.process.map(s => ({
    step: clamp(s && s.step ? s.step : 1, 1, 9),
    title: s && s.title ? String(s.title) : "",
    subtitle: s && s.subtitle ? String(s.subtitle) : ""
  }));

  if (!c.home.cta || typeof c.home.cta !== "object") c.home.cta = {};
  c.home.cta.title = c.home.cta.title || "";
  c.home.cta.subtitle = c.home.cta.subtitle || "";
  c.home.cta.whatsappText = c.home.cta.whatsappText || "Chat on WhatsApp";
  c.home.cta.callText = c.home.cta.callText || "Call Now";

  // CONTACT + FOOTER
  if (!c.contact || typeof c.contact !== "object") c.contact = {};
  c.contact.phone = c.contact.phone || "";
  c.contact.whatsapp = c.contact.whatsapp || "";
  c.contact.email = c.contact.email || "";
  c.contact.address = c.contact.address || "";
  c.contact.hours = c.contact.hours || "";

  if (!c.footer || typeof c.footer !== "object") c.footer = {};
  c.footer.text = c.footer.text || "";
  if (!Array.isArray(c.footer.quickLinks)) c.footer.quickLinks = [];
  c.footer.quickLinks = c.footer.quickLinks.map(l => ({
    label: l && l.label ? String(l.label) : "",
    url: l && l.url ? String(l.url) : ""
  }));

  // PAGES (object keyed by slug)
  if (!c.pages || typeof c.pages !== "object") c.pages = {};
  const normalizedPages = {};
  Object.keys(c.pages).forEach(k => {
    const p = c.pages[k] || {};
    p.slug = (p.slug || k || "").replace(/^\/+/,"");
    p._id = p._id || uid("page");
    p.title = p.title || "";
    p.headImage = p.headImage || "";
    p.contentHtml = p.contentHtml || "";
    p.h1 = p.h1 || "";
    p.h2 = p.h2 || "";
    p.seo = ensureSeoShape(p.seo);
    normalizedPages[p.slug || k] = p;
  });
  c.pages = normalizedPages;

  // FAQ
  if (!Array.isArray(c.faq)) c.faq = [];
  c.faq = c.faq.map(x => ({ q: x && x.q ? String(x.q) : "", a: x && x.a ? String(x.a) : "" }));

  // REVIEWS
  if (!Array.isArray(c.reviews)) c.reviews = [];
  c.reviews = c.reviews.map(r => ({
    name: r && r.name ? String(r.name) : "",
    rating: clamp(r && r.rating ? r.rating : 5, 1, 5),
    text: r && r.text ? String(r.text) : "",
    date: r && r.date ? String(r.date) : ""
  }));

  // IMAGES MAP
  if (!c.images || typeof c.images !== "object") c.images = {};
  if (!Array.isArray(c.images.map)) c.images.map = [];
  c.images.map = c.images.map.map(m => ({
    key: m && m.key ? String(m.key) : "",
    url: m && m.url ? String(m.url) : "",
    notes: m && m.notes ? String(m.notes) : ""
  }));

  // SERVICES (service pages)
  if (!Array.isArray(c.services)) c.services = [];
  c.services = c.services.map(s => {
    const out = s && typeof s === "object" ? s : {};
    out.slug = (out.slug || "").replace(/^\/+/,"");
    out.name = out.name || "";
    out.short = out.short || "";
    out.heroImage = out.heroImage || "";
    out.contentHtml = out.contentHtml || "";
    out.h1 = out.h1 || "";
    out.h2 = out.h2 || "";
    out.seo = ensureSeoShape(out.seo);
    return out;
  });

  return c;
}

/** -----------------------------
 *  LOAD CONFIG
 *  ----------------------------- */
async function loadConfig(){
  const res = await fetch("/api/config", { cache:"no-store" });
  if (!res.ok) throw new Error("Failed to load /api/config: " + await res.text());
  const data = await res.json();
  cfg = ensureShape(data);
  setDirty(false);
}

/** -----------------------------
 *  UPLOAD HELPERS
 *  ----------------------------- */
/** For hero banners ONLY -> /api/admin/upload-banner?slot=... */
async function uploadHeroBanner({ file, slot }){
  if (!getToken()) throw new Error("Paste ADMIN TOKEN and click Save first.");
  const fd = new FormData();
  fd.append("file", file);

  const qs = new URLSearchParams();
  qs.set("slot", slot);

  const res = await fetch(`/api/admin/upload-banner?${qs.toString()}`, {
    method: "POST",
    headers: authHeaders(),
    body: fd
  });
  if (!res.ok) throw new Error(await res.text());
  const out = await res.json();
  const url = out.publicUrl || out.url || "";
  if (!url) throw new Error("Upload response missing publicUrl");
  return url;
}

/** Generic upload for mapped images, page head, service hero, project images etc. */
async function uploadImageGeneric({ file, purpose, key }){
  if (!getToken()) throw new Error("Paste ADMIN TOKEN and click Save first.");
  const fd = new FormData();
  fd.append("file", file);

  const qs = new URLSearchParams();
  if (purpose) qs.set("purpose", purpose);
  if (key) qs.set("key", key);

  const res = await fetch(`/api/admin/upload-image?${qs.toString()}`, {
    method: "POST",
    headers: authHeaders(),
    body: fd
  });

  if (!res.ok) throw new Error(await res.text());
  const out = await res.json();
  const url = out.publicUrl || out.url || "";
  if (!url) throw new Error("Upload response missing publicUrl");
  return url;
}

/** -----------------------------
 *  NAV + PANEL SWITCH
 *  ----------------------------- */
function renderNav(){
  const nav = document.getElementById("nav");
  nav.innerHTML = PANELS.map(p => {
    const isActive = p.id === activePanel;
    return `
      <button data-panel="${p.id}"
        class="w-full text-left px-3 py-2 rounded-xl text-sm font-semibold
        ${isActive ? "bg-slate-900 text-white" : "hover:bg-slate-100 text-slate-800"}">
        ${escapeHtml(p.title)}
      </button>
    `;
  }).join("");

  nav.querySelectorAll("[data-panel]").forEach(btn => {
    btn.onclick = () => {
      try { collectAll(); } catch(e) {}
      activePanel = btn.dataset.panel;
      renderAll();
    };
  });
}

/** ============================================================
 *  HERO PANEL (Dynamic)
 * ============================================================ */
function heroPanel(){
  const slides = cfg.hero.slides || [];
  const buttons = cfg.hero.buttons || [];

  const slideOptions = slides.map(s => `<option value="${escapeHtml(s.key)}">${escapeHtml(s.key)} — ${escapeHtml(s.title || "(untitled)")}</option>`).join("");

  return `
    <div class="grid md:grid-cols-12 gap-4">
      <!-- left: slides list -->
      <div class="md:col-span-4 border rounded-2xl p-4 bg-slate-50">
        <div class="flex items-center justify-between gap-2">
          <div class="font-semibold">Hero Slides</div>
          <button id="heroAddSlide" class="px-3 py-1 rounded-lg bg-slate-900 text-white text-sm">+ Add</button>
        </div>

        <div class="mt-3">
          <label class="text-xs font-semibold">Auto-rotate (ms)</label>
          <input id="hero_autoRotateMs" type="number" min="0" max="60000"
            class="w-full border rounded-xl px-3 py-2 mt-1"
            value="${escapeHtml(String(cfg.hero.autoRotateMs || 5000))}"/>
          <p class="text-xs text-slate-500 mt-1">0 = no auto rotation.</p>
        </div>

        <div class="mt-4 space-y-2" id="heroSlidesList">
          ${slides.length ? slides.map((s, idx) => `
            <button data-hero-slide="${idx}"
              class="w-full text-left px-3 py-2 rounded-xl border bg-white hover:bg-slate-100">
              <div class="text-sm font-semibold">${escapeHtml(s.key)}</div>
              <div class="text-xs text-slate-500 truncate">${escapeHtml(s.title || "")}</div>
            </button>
          `).join("") : `<p class="text-sm text-slate-500">No slides yet. Click Add.</p>`}
        </div>

        <div class="mt-4 border-t pt-4">
          <div class="flex items-center justify-between">
            <div class="font-semibold text-sm">Hero Buttons</div>
            <button id="heroAddBtn" class="px-3 py-1 rounded-lg bg-slate-900 text-white text-sm">+ Add</button>
          </div>

          <div class="mt-3 space-y-3" id="heroBtnWrap">
            ${buttons.length ? buttons.map((b, i) => `
              <div class="border rounded-xl p-3 bg-white">
                <div class="flex items-center justify-between">
                  <div class="text-xs font-semibold text-slate-500">Button #${i+1}</div>
                  <button data-hero-del-btn="${i}" class="px-2 py-1 rounded-lg bg-red-600 text-white text-xs">Remove</button>
                </div>
                <div class="mt-2 grid grid-cols-2 gap-2">
                  <input id="hero_btn_label_${i}" class="border rounded-lg px-2 py-1" placeholder="Label"
                    value="${escapeHtml(b.label)}"/>
                  <select id="hero_btn_slideKey_${i}" class="border rounded-lg px-2 py-1">
                    <option value="">Select slide…</option>
                    ${slides.map(s => `<option value="${escapeHtml(s.key)}" ${s.key===b.slideKey ? "selected" : ""}>${escapeHtml(s.key)}</option>`).join("")}
                  </select>
                </div>
              </div>
            `).join("") : `<p class="text-sm text-slate-500">No buttons yet.</p>`}
          </div>
        </div>
      </div>

      <!-- right: editor -->
      <div class="md:col-span-8">
        <div class="border rounded-2xl p-4 bg-white">
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div>
              <div class="font-semibold">Slide Editor</div>
              <p class="text-xs text-slate-500">Select a slide from the left to edit.</p>
            </div>
            <div class="flex gap-2">
              <button id="heroMoveUp" class="px-3 py-2 rounded-xl bg-slate-200 text-sm">↑</button>
              <button id="heroMoveDown" class="px-3 py-2 rounded-xl bg-slate-200 text-sm">↓</button>
              <button id="heroDeleteSlide" class="px-3 py-2 rounded-xl bg-red-600 text-white text-sm">Delete</button>
            </div>
          </div>

          <div class="mt-4" id="heroEditorInner"></div>

          <div class="mt-4 p-4 rounded-2xl border bg-slate-50">
            <p class="text-sm text-slate-600">
              Banner upload uses <span class="font-mono">/api/admin/upload-banner?slot=...</span>.
              We send <b>slot = slide.key</b>.
            </p>
          </div>
        </div>
      </div>
    </div>
  `;
}

let heroSelectedIndex = 0;

function heroEditorForm(slide){
  if (!slide) return `<p class="text-sm text-slate-500">No slide selected.</p>`;
  const idx = heroSelectedIndex;
  const k = domSafeKey(slide.id);

  return `
    <div class="grid md:grid-cols-2 gap-3">
      <div>
        <label class="text-xs font-semibold">Key (unique)</label>
        <input id="hero_key_${k}" class="w-full border rounded-xl px-3 py-2"
          value="${escapeHtml(slide.key)}" placeholder="terrace"/>
      </div>
      <div>
        <label class="text-xs font-semibold">Title</label>
        <input id="hero_title_${k}" class="w-full border rounded-xl px-3 py-2"
          value="${escapeHtml(slide.title)}"/>
      </div>
    </div>

    <div class="mt-3">
      <label class="text-xs font-semibold">Sub</label>
      <textarea id="hero_sub_${k}" class="w-full border rounded-xl px-3 py-2" rows="2">${escapeHtml(slide.sub)}</textarea>
    </div>

async function uploadSelectedHeroBanner(){
  const slides = cfg.hero.slides || [];
  const slide = slides[heroSelectedIndex];
  if (!slide) return show("No slide selected.", true);

  const k = domSafeKey(slide.id);
  const fi = document.getElementById(`hero_file_${k}`);
  const file = fi?.files?.[0];
  if (!file) return show("Select a banner image first.", true);

  try{
    const slot = (document.getElementById(`hero_key_${k}`)?.value || slide.key || "").trim() || ("slide_"+slide.id.slice(-6));
    const url = await uploadHeroBanner({ file, slot });
    slide.image = url;
    document.getElementById(`hero_img_cur_${k}`).textContent = url;
    document.getElementById(`hero_image_${k}`).value = url;
    fi.value = "";
    setDirty(true);
    show(`Uploaded banner ✅ Now click Save Changes`);
  } catch(e){
    show("Upload failed: " + (e.message || e), true);
  }
}

/** ============================================================
 *  COLLECT (UI -> cfg)
 * ============================================================ */
function collectHero(){
  cfg.hero.autoRotateMs = clamp(document.getElementById("hero_autoRotateMs")?.value || cfg.hero.autoRotateMs, 0, 60000);

  // collect selected slide (only the editor is in DOM)
  const slides = cfg.hero.slides || [];
  const slide = slides[heroSelectedIndex];
  if (slide){
    const k = domSafeKey(slide.id);
    const newKey = (document.getElementById(`hero_key_${k}`)?.value || slide.key || "").trim();
    slide.key = newKey || slide.key;

    slide.title = (document.getElementById(`hero_title_${k}`)?.value || "").trim();
    slide.sub = (document.getElementById(`hero_sub_${k}`)?.value || "").trim();
    slide.bullets = (document.getElementById(`hero_bullets_${k}`)?.value || "")
      .split("\n").map(x=>x.trim()).filter(Boolean).slice(0,6);

    slide.ctaText = (document.getElementById(`hero_ctaText_${k}`)?.value || "").trim();
    slide.ctaLink = (document.getElementById(`hero_ctaLink_${k}`)?.value || "").trim();
    slide.image = (document.getElementById(`hero_image_${k}`)?.value || slide.image || "").trim();
  }

  // collect buttons
  const outBtns = [];
  (cfg.hero.buttons||[]).forEach((b, i) => {
    const label = (document.getElementById(`hero_btn_label_${i}`)?.value || "").trim();
    const slideKey = (document.getElementById(`hero_btn_slideKey_${i}`)?.value || "").trim();
    if (label || slideKey) outBtns.push({ label, slideKey });
  });
  cfg.hero.buttons = outBtns;

  // ensure unique keys
  const seen = new Set();
  cfg.hero.slides.forEach(s => {
    let k = (s.key||"").trim() || ("slide_"+s.id.slice(-6));
    while (seen.has(k)) k = k + "_1";
    seen.add(k);
    s.key = k;
  });

  // remove buttons that point to missing slide keys (keep but empty if user wants)
  const keys = new Set(cfg.hero.slides.map(s=>s.key));
  cfg.hero.buttons = cfg.hero.buttons.map(b => ({ label:b.label, slideKey: keys.has(b.slideKey) ? b.slideKey : b.slideKey }));

  setDirty(true);
}

      if (cl || cu) children.push({ label: cl, url: cu });
    }
    if (label || url || children.length) out.push({ label, url, children });
  });
  cfg.menu = out;
  setDirty(true);
}

function collectSEO(){
  cfg.seo.siteName = (document.getElementById("seo_siteName")?.value || "").trim();
  cfg.seo.canonicalBase = (document.getElementById("seo_canonicalBase")?.value || "").trim();
  cfg.seo.defaultTitle = (document.getElementById("seo_defaultTitle")?.value || "").trim();
  cfg.seo.defaultDescription = (document.getElementById("seo_defaultDescription")?.value || "").trim();
  cfg.seo.robots = (document.getElementById("seo_robots")?.value || "").trim();
  cfg.seo.defaultOgImage = (document.getElementById("seo_defaultOgImage")?.value || "").trim();
  cfg.seo.tags = (document.getElementById("seo_tags")?.value || "")
    .split(",").map(x=>x.trim()).filter(Boolean).slice(0,50);
  cfg.seo.h1Defaults = (document.getElementById("seo_h1Defaults")?.value || "").trim();
  cfg.seo.h2Defaults = (document.getElementById("seo_h2Defaults")?.value || "").trim();
  setDirty(true);
}

function collectPages(){
  const cards = Array.from(document.querySelectorAll("[data-page-id]"));
  const next = {};

  cards.forEach(card => {
    const pid = card.getAttribute("data-page-id");
    const domKey = domSafeKey(pid);

    const slug = (document.getElementById(`page_slug_${domKey}`)?.value || "").trim().replace(/^\/+/,"");
    if (!slug) return;

    const title = (document.getElementById(`page_title_${domKey}`)?.value || "").trim();
    const headImage = (document.getElementById(`page_head_${domKey}`)?.value || "").trim();
    const h1 = (document.getElementById(`page_h1_${domKey}`)?.value || "").trim();
    const h2 = (document.getElementById(`page_h2_${domKey}`)?.value || "").trim();
    const contentHtml = (document.getElementById(`page_html_${domKey}`)?.value || "");

    const seo = ensureSeoShape({
      title: (document.getElementById(`page_seo_title_${domKey}`)?.value || "").trim(),
      description: (document.getElementById(`page_seo_desc_${domKey}`)?.value || "").trim(),
      canonical: (document.getElementById(`page_seo_can_${domKey}`)?.value || "").trim(),
      robots: (document.getElementById(`page_seo_robots_${domKey}`)?.value || "").trim(),
      ogTitle: (document.getElementById(`page_seo_ogt_${domKey}`)?.value || "").trim(),
      ogDesc: (document.getElementById(`page_seo_ogd_${domKey}`)?.value || "").trim(),
      ogImage: (document.getElementById(`page_seo_ogi_${domKey}`)?.value || "").trim(),
      schemaJsonLd: (document.getElementById(`page_seo_schema_${domKey}`)?.value || "").trim()
    });

    next[slug] = { _id: pid, slug, title, headImage, contentHtml, h1, h2, seo };
  });

  cfg.pages = next;
  setDirty(true);
}

function collectFAQ(){
  const out = [];
  (cfg.faq||[]).forEach((x, idx) => {
    const q = (document.getElementById(`faq_q_${idx}`)?.value || "").trim();
    const a = (document.getElementById(`faq_a_${idx}`)?.value || "").trim();
    if (q || a) out.push({ q, a });
  });
  cfg.faq = out;
  setDirty(true);
}

function collectReviews(){
  const out = [];
  (cfg.reviews||[]).forEach((r, idx) => {
    const name = (document.getElementById(`rev_name_${idx}`)?.value || "").trim();
    const rating = clamp(document.getElementById(`rev_rating_${idx}`)?.value || 5, 1, 5);
    const date = (document.getElementById(`rev_date_${idx}`)?.value || "").trim();
    const text = (document.getElementById(`rev_text_${idx}`)?.value || "").trim();
    if (name || text) out.push({ name, rating, date, text });
  });
  cfg.reviews = out;
  setDirty(true);
}

function collectImages(){
  const out = [];
  (cfg.images.map||[]).forEach((m, idx) => {
    const key = (document.getElementById(`img_key_${idx}`)?.value || "").trim();
    const url = (document.getElementById(`img_url_${idx}`)?.value || "").trim();
    const notes = (document.getElementById(`img_notes_${idx}`)?.value || "").trim();
    if (key || url || notes) out.push({ key, url, notes });
  });
  cfg.images.map = out;
  setDirty(true);
}

function collectServices(){
  const out = [];
  (cfg.services||[]).forEach((s, idx) => {
    const name = (document.getElementById(`svc_name_${idx}`)?.value || "").trim();
    const slug = (document.getElementById(`svc_slug_${idx}`)?.value || "").trim().replace(/^\/+/,"");
    const short = (document.getElementById(`svc_short_${idx}`)?.value || "").trim();
    const heroImage = (document.getElementById(`svc_hero_${idx}`)?.value || "").trim();
    const h1 = (document.getElementById(`svc_h1_${idx}`)?.value || "").trim();
    const h2 = (document.getElementById(`svc_h2_${idx}`)?.value || "").trim();
    const contentHtml = (document.getElementById(`svc_html_${idx}`)?.value || "");

    const seo = ensureSeoShape({
      title: (document.getElementById(`svc_seo_title_${idx}`)?.value || "").trim(),
      description: (document.getElementById(`svc_seo_desc_${idx}`)?.value || "").trim(),
      canonical: (document.getElementById(`svc_seo_can_${idx}`)?.value || "").trim(),
      robots: (document.getElementById(`svc_seo_robots_${idx}`)?.value || "").trim(),
      ogTitle: (document.getElementById(`svc_seo_ogt_${idx}`)?.value || "").trim(),
      ogDesc: (document.getElementById(`svc_seo_ogd_${idx}`)?.value || "").trim(),
      ogImage: (document.getElementById(`svc_seo_ogi_${idx}`)?.value || "").trim(),
      schemaJsonLd: (document.getElementById(`svc_seo_schema_${idx}`)?.value || "").trim()
    });

    if (name || slug) out.push({ name, slug, short, heroImage, contentHtml, h1, h2, seo });
  });
  cfg.services = out;
  setDirty(true);
}

function collectAll(){
  // Only collect from panels that exist in DOM now
  if (document.getElementById("heroSlidesList")) collectHero();
  if (document.getElementById("homeServicesWrap")) collectHomeServices();
  if (document.getElementById("homeProjectsWrap")) collectHomeProjects();
  if (document.getElementById("homeAdvantagesWrap")) collectHomeAdvantages();
  if (document.getElementById("homeProcessWrap")) collectHomeProcess();
  if (document.getElementById("homeCtaContactWrap")) collectHomeCtaContact();

  if (document.getElementById("menuWrap")) collectMenu();
  if (document.getElementById("seo_siteName")) collectSEO();
  if (document.getElementById("pagesWrap")) collectPages();
  if (document.getElementById("faqWrap")) collectFAQ();
  if (document.getElementById("reviewsWrap")) collectReviews();
  if (document.getElementById("imagesWrap")) collectImages();
  if (document.getElementById("servicesWrap")) collectServices();

  cfg = ensureShape(cfg);
}

/** ============================================================
 *  SAVE
 * ============================================================ */
async function saveAll(){
  if (!getToken()) return show("Paste ADMIN TOKEN and click Save first.", true);

  try{
    collectAll();
    const res = await fetch("/api/admin/save-config", {
      method: "POST",
      headers: { ...authHeaders(), "content-type": "application/json" },
      body: JSON.stringify(cfg)
    });
    if (!res.ok) return show("Save failed: " + await res.text(), true);
    setDirty(false);
    show("Saved ✅");
  } catch(e){
    show(e.message || "Save failed", true);
  }
}

/** ============================================================
 *  RENDER PANEL
 * ============================================================ */
function renderPanel(){
  const title = PANELS.find(p=>p.id===activePanel)?.title || "Panel";
  document.getElementById("panelTitle").textContent = title;

  const panel = document.getElementById("panel");

  if (activePanel === "hero"){
    panel.innerHTML = heroPanel();

    // list click
    panel.querySelectorAll("[data-hero-slide]").forEach(btn => {
      btn.onclick = () => {
        try { collectHero(); } catch(e) {}
        heroSelectedIndex = clamp(btn.dataset.heroSlide, 0, (cfg.hero.slides.length-1));
        renderPanel(); // rerender only panel
      };
    });

    // editor render
    const slide = cfg.hero.slides[heroSelectedIndex];
    const editor = document.getElementById("heroEditorInner");
    editor.innerHTML = heroEditorForm(slide);

    // add slide
    document.getElementById("heroAddSlide").onclick = () => {
      collectHero();
      const id = uid("slide");
      const key = "slide_" + id.slice(-6);
      cfg.hero.slides.push({
        id, key,
        title: "New Slide",
        sub: "",
        bullets: [],
        image: "",
        ctaText: "Get Quote",
        ctaLink: ""
      });
      heroSelectedIndex = cfg.hero.slides.length - 1;
      setDirty(true);
      renderPanel();
    };

    // delete slide
    document.getElementById("heroDeleteSlide").onclick = () => {
      collectHero();
      if (!cfg.hero.slides.length) return;
      cfg.hero.slides.splice(heroSelectedIndex, 1);
      heroSelectedIndex = Math.max(0, heroSelectedIndex - 1);
      setDirty(true);
      renderPanel();
    };

    // move up/down
    document.getElementById("heroMoveUp").onclick = () => {
      collectHero();
      const i = heroSelectedIndex;
      if (i <= 0) return;
      const tmp = cfg.hero.slides[i-1];
      cfg.hero.slides[i-1] = cfg.hero.slides[i];
      cfg.hero.slides[i] = tmp;
      heroSelectedIndex = i-1;
      setDirty(true);
      renderPanel();
    };
    document.getElementById("heroMoveDown").onclick = () => {
      collectHero();
      const i = heroSelectedIndex;
      if (i >= cfg.hero.slides.length-1) return;
      const tmp = cfg.hero.slides[i+1];
      cfg.hero.slides[i+1] = cfg.hero.slides[i];
      cfg.hero.slides[i] = tmp;
      heroSelectedIndex = i+1;
      setDirty(true);
      renderPanel();
    };

    // upload banner
    if (slide){
      const k = domSafeKey(slide.id);
      const upBtn = document.getElementById(`hero_upload_${k}`);
      if (upBtn) upBtn.onclick = uploadSelectedHeroBanner;
    }

    // add button
    document.getElementById("heroAddBtn").onclick = () => {
      collectHero();
      cfg.hero.buttons.push({ label:"", slideKey: (cfg.hero.slides[0]?.key || "") });
      setDirty(true);
      renderPanel();
    };

    // delete button
    panel.querySelectorAll("[data-hero-del-btn]").forEach(btn => {
      btn.onclick = () => {
        collectHero();
        cfg.hero.buttons.splice(Number(btn.dataset.heroDelBtn), 1);
        setDirty(true);
        renderPanel();
      };
    });
  }

  else if (activePanel === "home_services"){
    panel.innerHTML = panelHomeServices();

    document.getElementById("homeAddSvc").onclick = () => {
      collectHomeServices();
      cfg.home.servicesGrid.push({ title:"", subtitle:"", bullets:[], icon:"", linkText:"Get Quote", linkUrl:"" });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-home-svc]").forEach(btn => {
      btn.onclick = () => {
        collectHomeServices();
        cfg.home.servicesGrid.splice(Number(btn.dataset.delHomeSvc), 1);
        setDirty(true);
        renderAll();
      };
    });
  }

  else if (activePanel === "home_projects"){
    panel.innerHTML = panelHomeProjects();

    document.getElementById("homeAddProj").onclick = () => {
      collectHomeProjects();
      cfg.home.projects.push({ title:"", tag:"", image:"", subtitle:"", linkUrl:"" });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-home-proj]").forEach(btn => {
      btn.onclick = () => {
        collectHomeProjects();
        cfg.home.projects.splice(Number(btn.dataset.delHomeProj), 1);
        setDirty(true);
        renderAll();
      };
    });

    panel.querySelectorAll("[data-upload-home-proj]").forEach(btn => {
      btn.onclick = () => uploadHomeProjectImage(Number(btn.dataset.uploadHomeProj));
    });
  }

  else if (activePanel === "home_advantages"){
    panel.innerHTML = panelHomeAdvantages();

    document.getElementById("homeAddAdv").onclick = () => {
      collectHomeAdvantages();
      cfg.home.advantages.push({ title:"", subtitle:"", icon:"" });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-home-adv]").forEach(btn => {
      btn.onclick = () => {
        collectHomeAdvantages();
        cfg.home.advantages.splice(Number(btn.dataset.delHomeAdv), 1);
        setDirty(true);
        renderAll();
      };
    });
  }

  else if (activePanel === "home_process"){
    panel.innerHTML = panelHomeProcess();

    document.getElementById("homeAddStep").onclick = () => {
      collectHomeProcess();
      const nextStep = (cfg.home.process.length ? Math.max(...cfg.home.process.map(s=>Number(s.step)||1)) + 1 : 1);
      cfg.home.process.push({ step: clamp(nextStep,1,9), title:"", subtitle:"" });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-home-step]").forEach(btn => {
      btn.onclick = () => {
        collectHomeProcess();
        cfg.home.process.splice(Number(btn.dataset.delHomeStep), 1);
        setDirty(true);
        renderAll();
      };
    });
  }

  else if (activePanel === "home_cta_contact"){
    panel.innerHTML = panelHomeCtaContact();

    document.getElementById("footerAddLink").onclick = () => {
      collectHomeCtaContact();
      cfg.footer.quickLinks.push({ label:"", url:"" });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-footer-del]").forEach(btn => {
      btn.onclick = () => {
        collectHomeCtaContact();
        cfg.footer.quickLinks.splice(Number(btn.dataset.footerDel), 1);
        setDirty(true);
        renderAll();
      };
    });
  }

  else if (activePanel === "menu"){
    panel.innerHTML = panelMenu();

    document.getElementById("addMenu").onclick = () => {
      collectMenu();
      cfg.menu.push({ label:"", url:"", children:[] });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-menu]").forEach(btn => {
      btn.onclick = () => {
        collectMenu();
        cfg.menu.splice(Number(btn.dataset.delMenu), 1);
        setDirty(true);
        renderAll();
      };
    });

    panel.querySelectorAll("[data-add-child]").forEach(btn => {
      btn.onclick = () => {
        collectMenu();
        const idx = Number(btn.dataset.addChild);
        cfg.menu[idx].children = cfg.menu[idx].children || [];
        cfg.menu[idx].children.push({ label:"", url:"" });
        setDirty(true);
        renderAll();
      };
    });

    panel.querySelectorAll("[data-del-child]").forEach(btn => {
      btn.onclick = () => {
        collectMenu();
        const [i,c] = btn.dataset.delChild.split(":").map(Number);
        cfg.menu[i].children.splice(c,1);
        setDirty(true);
        renderAll();
      };
    });
  }

  else if (activePanel === "seo"){
    panel.innerHTML = panelSEO();
  }

  else if (activePanel === "pages"){
    panel.innerHTML = panelPages();

    document.getElementById("addPage").onclick = () => {
      collectPages();
      const tmpSlug = uid("page").slice(0,10);
      cfg.pages[tmpSlug] = {
        _id: uid("page"),
        slug: tmpSlug,
        title: "New Page",
        headImage: "",
        contentHtml: "<p>Paste your content here…</p>",
        h1: "",
        h2: "",
        seo: ensureSeoShape({})
      };
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-page-id]").forEach(btn => {
      btn.onclick = () => {
        collectPages();
        const pid = btn.dataset.delPageId;
        const next = {};
        Object.values(cfg.pages||{}).forEach(p=>{
          if (p._id !== pid) next[p.slug] = p;
        });
        cfg.pages = next;
        setDirty(true);
        renderAll();
      };
    });

    panel.querySelectorAll("[data-upload-page-head]").forEach(btn => {
      btn.onclick = async () => {
        const pid = btn.dataset.uploadPageHead;
        const page = Object.values(cfg.pages||{}).find(p => p._id === pid);
        if (!page) return show("Page not found.", true);

        const domKey = domSafeKey(pid);
        const fi = document.getElementById(`page_file_${domKey}`);
        const file = fi?.files?.[0];
        if (!file) return show("Select an image first.", true);

        try{
          const slug = (document.getElementById(`page_slug_${domKey}`)?.value || page.slug || "page").trim().replace(/^\/+/,"");
          const url = await uploadImageGeneric({ file, purpose:"pageHead", key: slug });
          document.getElementById(`page_head_${domKey}`).value = url;
          fi.value = "";
          setDirty(true);
          show("Uploaded ✅ Now click Save Changes");
        } catch(e){
          show("Upload failed: " + (e.message || e), true);
        }
      };
    });
  }

  else if (activePanel === "faq"){
    panel.innerHTML = panelFAQ();

    document.getElementById("addFaq").onclick = () => {
      collectFAQ();
      cfg.faq.push({ q:"", a:"" });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-faq]").forEach(btn => {
      btn.onclick = () => {
        collectFAQ();
        cfg.faq.splice(Number(btn.dataset.delFaq), 1);
        setDirty(true);
        renderAll();
      };
    });
  }

  else if (activePanel === "reviews"){
    panel.innerHTML = panelReviews();

    document.getElementById("addReview").onclick = () => {
      collectReviews();
      cfg.reviews.push({ name:"", rating:5, text:"", date:"" });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-review]").forEach(btn => {
      btn.onclick = () => {
        collectReviews();
        cfg.reviews.splice(Number(btn.dataset.delReview), 1);
        setDirty(true);
        renderAll();
      };
    });
  }

  else if (activePanel === "images"){
    panel.innerHTML = panelImages();

    document.getElementById("addImgMap").onclick = () => {
      collectImages();
      cfg.images.map.push({ key:"", url:"", notes:"" });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-imgmap]").forEach(btn => {
      btn.onclick = () => {
        collectImages();
        cfg.images.map.splice(Number(btn.dataset.delImgmap), 1);
        setDirty(true);
        renderAll();
      };
    });

    panel.querySelectorAll("[data-upload-imgmap]").forEach(btn => {
      btn.onclick = () => uploadImgMap(Number(btn.dataset.uploadImgmap));
    });
  }

  else if (activePanel === "services"){
    panel.innerHTML = panelServices();

    document.getElementById("addService").onclick = () => {
      collectServices();
      cfg.services.push({
        slug:"",
        name:"New Service",
        short:"",
        heroImage:"",
        contentHtml:"<p>Paste service content here…</p>",
        h1:"",
        h2:"",
        seo: ensureSeoShape({})
      });
      setDirty(true);
      renderAll();
    };

    panel.querySelectorAll("[data-del-service]").forEach(btn => {
      btn.onclick = () => {
        collectServices();
        cfg.services.splice(Number(btn.dataset.delService), 1);
        setDirty(true);
        renderAll();
      };
    });

    panel.querySelectorAll("[data-upload-svc-hero]").forEach(btn => {
      btn.onclick = () => uploadServiceHero(Number(btn.dataset.uploadSvcHero));
    });
  }

  else {
    panel.innerHTML = `<p class="text-sm text-slate-500">Panel not found.</p>`;
  }

  // global dirty toggle on any change
  panel.querySelectorAll("input,textarea,select").forEach(el=>{
    el.addEventListener("input", ()=> setDirty(true), { passive:true });
    el.addEventListener("change", ()=> setDirty(true), { passive:true });
  });
}

function renderAll(){
  renderNav();
  renderPanel();
  document.getElementById("loginStatus").textContent =
    getToken() ? "Token saved in browser ✅" : "Not logged in";
  if (!isDirty) setDirty(false);
}

/** ============================================================
 *  LOGIN + SAVE BUTTONS
 * ============================================================ */
document.getElementById("saveToken").onclick = () => {
  const t = document.getElementById("token").value.trim();
  if (!t) return show("Paste token first.", true);
  setToken(t);
  renderAll();
  show("Token saved ✅");
};
document.getElementById("logout").onclick = () => {
  clearToken();
  renderAll();
  show("Logged out ✅");
};
document.getElementById("saveAll").onclick = saveAll;
document.getElementById("saveAllTop").onclick = saveAll;

/** Warn before leaving with unsaved changes */
window.addEventListener("beforeunload", (e)=>{
  if (!isDirty) return;
  e.preventDefault();
  e.returnValue = "";
});

/** ============================================================
 *  INIT
 * ============================================================ */
(async ()=>{
  try{
    document.getElementById("token").value = getToken();
    document.getElementById("cfgSource").textContent = "/api/config";
    await loadConfig();
    // if there are no hero slides but there are hero buttons (rare), keep stable
    heroSelectedIndex = 0;
    renderAll();
    show("Loaded ✅");
  } catch(e){
    show(e.message || "Failed to load config", true);
  }
})();
</script>
